    pressure_weather_source_name: str
    pressure_weather_max_age_seconds: int(60,86400)
    pressure_weather_max_difference_hpa: float(0.1,20.0)
  safety:
    profile: list(gq|bfs_reference|icrp_reference|custom)
    threshold_basis: list(cpm|dose_rate|either)
    warning_cpm: int(0,)
    danger_cpm: int(1,)
    warning_usvh: float(0.0,)
