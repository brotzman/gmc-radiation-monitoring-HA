name: GMC Radiation Monitor
description: Local GQ GMC monitoring with MQTT Discovery, configurable safety profiles, background anomaly 
  detection, diagnostics, reports, backups and streamed exports
version: 9.3.0
slug: gmc_radiation_monitor
url: https://github.com/brotzman/gmc-homeassistant/tree/main/gmc_radiation_monitor
stage: stable
arch:
- aarch64
- amd64
startup: application
boot: auto
init: false
uart: true
apparmor: true
tmpfs: true
services:
- mqtt:need
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:radioactive
panel_title: Radiation Monitoring
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
options:
  devices:
  - name: GMC-320
    scan_interval: 60
    command_timeout: 3.0
    inter_command_delay_ms: 250
    serial_startup_delay: 0
    auxiliary_read_interval: 300
    read_gyro: false
    read_device_time: false
    device_clock_warning_seconds: 120
    heartbeat_enabled: false
    detector_profile: gmc_320_plus_v4
    gmcmap_counter_id: ''
    serial_debug: false
    serial_debug_max_bytes: 64
    orientation_calibration_enabled: false
  dual_tube_devices:
  - name: GMC-500+
    scan_interval: 75
    command_timeout: 4.0
    inter_command_delay_ms: 600
    serial_startup_delay: 15
    auxiliary_read_interval: 300
    read_gyro: false
    read_device_time: false
    device_clock_warning_seconds: 120
    heartbeat_enabled: false
    detector_profile: gmc_500_plus
    gmcmap_counter_id: ''
    serial_debug: false
    serial_debug_max_bytes: 64
    orientation_calibration_enabled: false
    dual_tube_mode: separate
    dual_tube_switch_cpm: 30000
    high_dose_tube_model: SI-3BG
    high_dose_dead_time_us: 30.0
    high_dose_dead_time_model: nonparalyzable
    high_dose_calibration_reference: No verified SI-3BG dose factor; CPM display only
  gmcmap:
    enabled: false
    privacy_confirmed: false
    account_id: ''
    upload_interval: 300
    timeout: 10.0
  history:
    retention_days: 730
    report_timezone: Europe/Berlin
    history_management_enabled: false
  analysis:
    traffic_light_yellow_percent: 125.0
    traffic_light_red_percent: 175.0
    smart_alerts_enabled: true
    rapid_rise_percent: 50.0
    rapid_rise_window_minutes: 10
    sustained_alert_minutes: 30
    baseline_learning_days: 7
    external_temperature_entity: ''
    external_temperature_name: ''
    external_temperature_max_age_seconds: 900
    cosmic_hint_enabled: false
    pressure_weather_entity_primary: ''
    pressure_weather_entity_secondary: ''
    pressure_weather_source_name: Meteorologisk institutt (Met.no)
    pressure_weather_max_age_seconds: 7200
    pressure_weather_max_difference_hpa: 5.0
  safety:
    profile: gq
    threshold_basis: either
    warning_cpm: 51
    danger_cpm: 100
    warning_usvh: 0.326
    danger_usvh: 0.651
  interface:
    publish_advanced_sensors: true
    ui_mode: simple
    ui_language: auto
    main_value_size: large
    custom_value_font_size_px: 36
  system:
    log_level: info
    serial_scheduler_enabled: true
    serial_scheduler_gap_seconds: 2.0
    bridge_heartbeat_interval_seconds: 15
    health_startup_grace_seconds: 900
    health_bridge_warning_seconds: 45
    health_bridge_error_seconds: 120
    health_measurement_warning_seconds: 600
    health_measurement_error_seconds: 1200
schema:
  devices:
  - name: str?
    scan_interval: int(5,)?
    command_timeout: float(0.2,10.0)?
    inter_command_delay_ms: int(50,2000)?
    serial_startup_delay: float(0.0,300.0)?
    auxiliary_read_interval: int(0,86400)?
    read_gyro: bool?
    read_device_time: bool?
    device_clock_warning_seconds: int(10,86400)?
    heartbeat_enabled: bool?
    detector_profile: list(auto|gmc_300|gmc_320_plus_v4|gmc_500_plus|gmc_600_plus|custom_single|custom_dual)?
    cpm_per_usvh: float(0.001,)?
    dead_time_us: float(0.001,)?
    reliable_max_cpm: int(1,)?
    dead_time_model: list(none|nonparalyzable)?
    conversion_factor_uncertainty_percent: float(0.0,)?
    calibration_uncertainty_percent: float(0.0,)?
    calibration_reference: str?
    tube_model: str?
    gmcmap_counter_id: str?
    serial_debug: bool?
    serial_debug_max_bytes: int(16,1024)?
    orientation_calibration_enabled: bool?
    orientation_calibration_serial: str?
    orientation_offset_x: float?
    orientation_offset_y: float?
    orientation_offset_z: float?
    orientation_scale_x: float?
    orientation_scale_y: float?
    orientation_scale_z: float?
    orientation_calibration_name: str?
  dual_tube_devices:
  - name: str
    device_serial: str?
    scan_interval: int(5,)?
    command_timeout: float(0.2,10.0)?
    inter_command_delay_ms: int(50,2000)?
    serial_startup_delay: float(0.0,300.0)?
    auxiliary_read_interval: int(0,86400)?
    read_gyro: bool?
    read_device_time: bool?
    device_clock_warning_seconds: int(10,86400)?
    heartbeat_enabled: bool?
    detector_profile: list(auto|gmc_300|gmc_320_plus_v4|gmc_500_plus|gmc_600_plus|custom_single|custom_dual)?
    cpm_per_usvh: float(0.001,)?
    dead_time_us: float(0.001,)?
    reliable_max_cpm: int(1,)?
    dead_time_model: list(none|nonparalyzable)?
    conversion_factor_uncertainty_percent: float(0.0,)?
    calibration_uncertainty_percent: float(0.0,)?
    calibration_reference: str?
    tube_model: str?
    gmcmap_counter_id: str?
    serial_debug: bool?
    serial_debug_max_bytes: int(16,1024)?
    orientation_calibration_enabled: bool?
    orientation_calibration_serial: str?
    orientation_offset_x: float?
    orientation_offset_y: float?
    orientation_offset_z: float?
    orientation_scale_x: float?
    orientation_scale_y: float?
    orientation_scale_z: float?
    orientation_calibration_name: str?
    dual_tube_mode: list(separate|curve)
    dual_tube_switch_cpm: int(1,)?
    high_dose_tube_model: str?
    high_dose_cpm_per_usvh: float(0.001,)?
    high_dose_dead_time_us: float(0.001,)?
    high_dose_reliable_max_cpm: int(1,)?
    high_dose_dead_time_model: list(none|nonparalyzable)?
    high_dose_conversion_factor_uncertainty_percent: float(0.0,)?
    high_dose_calibration_uncertainty_percent: float(0.0,)?
    high_dose_calibration_reference: str?
  gmcmap:
    enabled: bool
    privacy_confirmed: bool
    account_id: str
    upload_interval: int(60,86400)
    timeout: float(1.0,30.0)
  history:
    retention_days: int(7,3650)
    report_timezone: str
    history_management_enabled: bool
  analysis:
    traffic_light_yellow_percent: float(100.0,)
    traffic_light_red_percent: float(100.0,)
    smart_alerts_enabled: bool
    rapid_rise_percent: float(1.0,)
    rapid_rise_window_minutes: int(1,1440)
    sustained_alert_minutes: int(1,1440)
    baseline_learning_days: int(1,90)
    external_temperature_entity: str
    external_temperature_name: str
    external_temperature_max_age_seconds: int(30,86400)
