  interface:
    publish_advanced_sensors: bool
    ui_mode: list(simple|advanced)
    ui_language: list(auto|en|de|fr|es|it|nl|pl|hr)
    main_value_size: list(small|medium|large|custom)
    custom_value_font_size_px: int(20,64)
  system:
