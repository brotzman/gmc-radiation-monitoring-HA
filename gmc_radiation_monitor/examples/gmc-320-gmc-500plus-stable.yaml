devices:
  - name: GMC-320
    scan_interval: 60
    command_timeout: 3.0
    inter_command_delay_ms: 250
    serial_startup_delay: 0
    auxiliary_read_interval: 300
    read_gyro: false
    read_device_time: false
    heartbeat_enabled: false
    cpm_per_usvh: 154.0
    dead_time_us: 120
    reliable_max_cpm: 50000
    dead_time_model: nonparalyzable
    conversion_factor_uncertainty_percent: 20
    tube_model: M4011
    dual_tube_mode: single
    low_dose_tube:
      tube_model: M4011
      cpm_per_usvh: 154.0
      dead_time_us: 120
      reliable_max_cpm: 50000
      dead_time_model: nonparalyzable
      conversion_factor_uncertainty_percent: 20
      calibration_reference: M4011 working values
    high_dose_tube:
      tube_model: ""
      cpm_per_usvh: null
      dead_time_us: null
      reliable_max_cpm: null
      dead_time_model: none
      calibration_reference: ""
    gmcmap_counter_id: ""

  - name: GMC-500+
    scan_interval: 75
    command_timeout: 4.0
    inter_command_delay_ms: 600
    serial_startup_delay: 15
    auxiliary_read_interval: 300
    read_gyro: false
    read_device_time: false
    heartbeat_enabled: false
    cpm_per_usvh: 154.0
    dead_time_us: 120
    reliable_max_cpm: 30000
    dead_time_model: nonparalyzable
    conversion_factor_uncertainty_percent: 20
    tube_model: M4011 + SI-3BG (Dual)
    dual_tube_mode: separate
    dual_tube_switch_cpm: 30000
    low_dose_tube:
      tube_model: M4011
      cpm_per_usvh: 154.0
      dead_time_us: 120
      reliable_max_cpm: 30000
      dead_time_model: nonparalyzable
      conversion_factor_uncertainty_percent: 20
      calibration_reference: M4011 normal-range working values
    high_dose_tube:
      tube_model: SI-3BG
      cpm_per_usvh: null
      dead_time_us: null
      reliable_max_cpm: null
      dead_time_model: none
      calibration_reference: ""
    gmcmap_counter_id: ""

gmcmap:
  enabled: false
  privacy_confirmed: false
  account_id: ""
  upload_interval: 300
  timeout: 10.0

system:
  serial_scheduler_enabled: true
  serial_scheduler_gap_seconds: 2.0
