devices:
  - name: GMC-320
    detector_profile: gmc_320_plus_v4
    scan_interval: 60
    command_timeout: 3.0
    inter_command_delay_ms: 250
    serial_startup_delay: 0
    auxiliary_read_interval: 300
    read_gyro: false
    read_device_time: false
    heartbeat_enabled: false
    gmcmap_counter_id: ""

  - name: GMC-500+
    detector_profile: gmc_500_plus
    scan_interval: 75
    command_timeout: 4.0
    inter_command_delay_ms: 600
    serial_startup_delay: 15
    auxiliary_read_interval: 300
    read_gyro: false
    read_device_time: false
    heartbeat_enabled: false
    # The preset configures M4011 as the primary tube. Second-tube
    # settings are kept once in the dedicated section below.
    gmcmap_counter_id: ""

dual_tube_devices:
  - name: GMC-500+
    dual_tube_mode: separate
    dual_tube_switch_cpm: 30000
    high_dose_tube_model: SI-3BG
    high_dose_dead_time_us: 30
    high_dose_dead_time_model: nonparalyzable
    # Add only verified SI-3BG calibration values:
    # high_dose_cpm_per_usvh: 5.15
    # high_dose_reliable_max_cpm: 200000
    # high_dose_calibration_reference: Individual verified calibration

gmcmap:
  enabled: false
  privacy_confirmed: false
  account_id: ""
  upload_interval: 300
  timeout: 10.0

system:
  serial_scheduler_enabled: true
  serial_scheduler_gap_seconds: 2.0
