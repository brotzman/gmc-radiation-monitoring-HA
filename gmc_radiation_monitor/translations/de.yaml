All GMC history was deleted: Der gesamte GMC-Verlauf wurde gelöscht
Another report or maintenance job is running: Ein anderer Bericht- oder Wartungsvorgang läuft bereits
Complete history deletion failed: Vollständiges Löschen des Verlaufs fehlgeschlagen
Danger zone: Gefahrenbereich
Delete all GMC history: Gesamten GMC-Verlauf löschen
Deletion confirmation text must be exactly DELETE ALL GMC HISTORY: Der Bestätigungstext muss exakt DELETE ALL 
  GMC HISTORY lauten
History deleted: Verlauf gelöscht
Invalid deletion confirmation: Ungültige Löschbestätigung
? Permanently delete all GMC history from this app and Home Assistant Recorder. This includes CPM, 
  temperature, voltage, gyro and tube measurements for every known GMC and all time periods.
: Löscht dauerhaft den gesamten GMC-Verlauf aus dieser App und dem Home-Assistant-Recorder. Dies umfasst CPM, 
  Temperatur, Spannung, Gyro- und Röhrenmesswerte aller bekannten GMCs über alle Zeiträume.
This cannot be undone. Delete all GMC history?: Dies kann nicht rückgängig gemacht werden. Gesamten 
  GMC-Verlauf löschen?
Type DELETE ALL GMC HISTORY to confirm: Zur Bestätigung DELETE ALL GMC HISTORY eingeben
configuration:
  analysis:
    description: Gemeinsame Basislinien-, Ampel- und Ereigniseinstellungen für alle Geräte.
    fields:
      baseline_learning_days:
        description: Historientage für die lokale Hintergrundbasis.
        name: Lernzeitraum der Basis
      external_temperature_entity:
        description: Home-Assistant-Sensor für die CPM–Temperatur-Korrelation, wenn das GMC keine eigene 
          Temperatur liefert. Voreingestellt auf das Arbeitszimmer; die Entity-ID bleibt editierbar.
        name: Externe Temperatur-Entität
      external_temperature_max_age_seconds:
        description: Ältere Home-Assistant-Temperaturwerte werden nicht für die Korrelation verwendet.
        name: Maximales Alter der externen Temperatur
      external_temperature_name:
        description: Alternativer Anzeigename zur automatischen Suche, falls sich die voreingestellte 
          Entity-ID unterscheidet oder geändert wurde.
        name: Suchname der externen Temperatur
      cosmic_hint_enabled:
        description: Lernt eine vorsichtige luftdruckbezogene Hintergrundsignatur. Dies ist nur ein 
          statistischer Hinweis und unterdrückt niemals Strahlungswarnungen.
        name: Statistischer Hinweis auf kosmischen Einfluss
      pressure_weather_entity_primary:
        description: Primäre Home-Assistant-Wetterentität für den aktuellen Luftdruck.
        name: Primäre Luftdruck-Wetterentität
      pressure_weather_entity_secondary:
        description: Optionale zweite Wetterentität zur Plausibilisierung des Luftdruckwerts.
        name: Sekundäre Luftdruck-Wetterentität
      pressure_weather_source_name:
        description: Anbietername, der bei der Luftdruckquelle angezeigt wird.
        name: Anbieter der Luftdruckquelle
      pressure_weather_max_age_seconds:
        description: Ältere Wetter-Luftdruckwerte werden nicht in das Modell übernommen.
        name: Maximales Alter des Luftdruckwerts
      pressure_weather_max_difference_hpa:
        description: Maximal zulässige Abweichung zwischen beiden Luftdruckquellen, bevor der Wert verworfen 
          wird.
        name: Maximale Abweichung der Luftdruckquellen
      rapid_rise_percent:
        description: Prozentuale Zunahme, die im gewählten Zeitfenster ein Ereignis auslöst.
        name: Schneller Anstieg
      rapid_rise_window_minutes:
        description: Vergleichszeitraum in Minuten.
        name: Zeitfenster des Anstiegs
      smart_alerts_enabled:
        description: Schnelle Anstiege, anhaltende Erhöhungen und Normalisierung erkennen.
        name: Intelligente Ereignisse
      sustained_alert_minutes:
        description: Minuten oberhalb der erlernten Basis bis zum Dauerereignis.
        name: Dauerhafte Erhöhung
      traffic_light_red_percent:
        description: Rote Abweichungsschwelle; muss über Gelb liegen. Kein Sicherheitsgrenzwert.
        name: 'Relative Ampel: Rot'
      traffic_light_yellow_percent:
        description: Abweichung des 1-Stunden-Mittels von der erlernten Basis in Prozent. Kein 
          Sicherheitsgrenzwert.
        name: 'Relative Ampel: Gelb'
    name: Hintergrundanalyse
  devices:
    description: Vollständige Konfiguration für GMC-300, GMC-320, GMC-600/600+ und andere Geräte mit genau 
      einem physischen Zählrohr. Dual-Tube-Felder werden hier nicht angezeigt.
    fields:
      auxiliary_read_interval:
        description: Sekunden zwischen Abfragen von Temperatur, Spannung, Dual-Tube, Gerätezeit und Gyro. CPM 
          wird weiterhin im Messintervall gelesen; 0 liest Zusatzwerte in jedem Zyklus.
        name: Intervall der Zusatzwerte
      command_timeout:
        description: Maximale Wartezeit auf eine Geräteantwort in Sekunden.
        name: Antwort-Timeout
      cpm_per_usvh:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Umrechnungsfaktor'
      device_clock_warning_seconds:
        description: Zulässige Zeitabweichung in Sekunden.
        name: Warnschwelle der Geräteuhr
      gmcmap_counter_id:
        description: Eigene öffentliche GMCMap-Counter-ID für dieses Gerät.
        name: GMCMap-Zähler-ID
      heartbeat_enabled:
        description: Live-CPS für dieses Gerät aktivieren, sofern unterstützt.
        name: 1-Hz-Heartbeat aktivieren
      inter_command_delay_ms:
        description: Pause zwischen Gerätebefehlen in Millisekunden.
        name: Befehlsabstand
      name:
        description: Eindeutiger Name für Home Assistant und das gemeinsame Dashboard, z. B. Keller.
        name: Anzeigename
      read_device_time:
        description: Gerätezeit dieses GMC abfragen, sofern unterstützt.
        name: Geräteuhr lesen
      read_gyro:
        description: Optionale Gyro-Daten für dieses Gerät abfragen.
        name: Gyro-Diagnose lesen
      scan_interval:
        description: Sekunden zwischen dauerhaft gespeicherten Messungen dieses Geräts.
        name: Messintervall
      serial_debug:
        description: Begrenzte TX/RX-Hex- und ASCII-Vorschauen für dieses Gerät protokollieren. Nur zur 
          Diagnose aktivieren.
        name: Serielle Frame-Diagnose
      serial_debug_max_bytes:
        description: Maximale Anzahl angezeigter Bytes je TX/RX-Frame.
        name: Byte-Limit der Frame-Diagnose
      serial_startup_delay:
        description: Startversatz in Sekunden vor der Initialisierung dieses Geräts. Konfigurierte größere 
          Werte bleiben erhalten; zwischen zwei Geräten werden immer mindestens 15 Sekunden eingehalten.
        name: Serieller Startversatz
      orientation_calibration_enabled:
        name: Lagekalibrierung aktivieren
        description: Die konfigurierten Offsets und Skalierungen für Roll-, Nick- und Neigungswinkel 
          verwenden.
      orientation_calibration_serial:
        name: Seriennummer der Kalibrierung
        description: Seriennummer des Geräts, für das diese Kalibrierung gilt.
      orientation_offset_x:
        name: Lagekalibrierung X-Offset
        description: Rohwert-Nullpunkt der X-Achse aus der Sechs-Lagen-Kalibrierung.
      orientation_offset_y:
        name: Lagekalibrierung Y-Offset
        description: Rohwert-Nullpunkt der Y-Achse aus der Sechs-Lagen-Kalibrierung.
      orientation_offset_z:
        name: Lagekalibrierung Z-Offset
        description: Rohwert-Nullpunkt der Z-Achse aus der Sechs-Lagen-Kalibrierung.
      orientation_scale_x:
        name: Lagekalibrierung X-Skalierung
        description: Rohwertschritte der X-Achse für 1 g.
      orientation_scale_y:
        name: Lagekalibrierung Y-Skalierung
        description: Rohwertschritte der Y-Achse für 1 g.
      orientation_scale_z:
        name: Lagekalibrierung Z-Skalierung
        description: Rohwertschritte der Z-Achse für 1 g.
      orientation_calibration_name:
        name: Name des Kalibrierprofils
        description: Name, der bei den berechneten Lagewerten angezeigt wird.
      dead_time_us:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Detektor-Totzeit'
      reliable_max_cpm:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Maximal zuverlässige CPM'
      dead_time_model:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Totzeitmodell'
      conversion_factor_uncertainty_percent:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Unsicherheit des Umrechnungsfaktors'
      calibration_uncertainty_percent:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Kalibrierungsunsicherheit'
      calibration_reference:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Kalibrierungsreferenz'
      tube_model:
        description: Wird durch das Detektorprofil vordefiniert. Nur eintragen, wenn der Standardwert für 
          dieses Gerät ersetzt werden soll.
        name: 'Einziges/primäres Zählrohr: Zählrohrmodell'
      detector_profile:
        name: Geräteprofil (automatisch/Voreinstellung)
        description: Wählt ein Anwendungsprofil für das Gerät. „Auto“ erkennt die GMC-Modellfamilie anhand der
          Geräteidentität oder des konfigurierten Namens und lädt Arbeitswerte für Zählrohrmodell, Totzeit, 
          Umrechnungsfaktor und Warnschwellen. Ein ausgetauschtes Zählrohr kann damit nicht physisch 
          verifiziert werden.
    name: Ein-Zählrohr-Geräte
  dual_tube_devices:
