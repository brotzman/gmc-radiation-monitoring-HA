        description: Optionale Identitätsprüfung. Ist sie gesetzt, muss der verbundene Zähler exakt diese 
          Seriennummer melden; andernfalls wird die Zwei-Zählrohr-Konfiguration aus Sicherheitsgründen nicht 
          angewendet.
      dual_tube_mode:
        name: Zählrohrbetrieb (erweitert)
        description: „separate“ wertet beide Zählrohrkanäle getrennt aus; „curve“ verwendet den eingetragenen 
          Umschaltwert.
      dual_tube_switch_cpm:
        name: Umschaltwert des zweiten Zählrohrs
        description: Arbeits-Umschaltwert für das zweite Zählrohr. Nur mit verifizierten gerätespezifischen 
