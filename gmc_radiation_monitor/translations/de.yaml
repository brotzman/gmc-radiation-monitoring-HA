        name: 'Zweites Zählrohr: Kalibrierungsunsicherheit'
        description: Relative Standardunsicherheit der Kalibrierung des zweiten Zählrohrs in Prozent.
      high_dose_calibration_reference:
        name: 'Zweites Zählrohr: Kalibrierungsreferenz'
        description: Zertifikat, Labor oder andere Referenz für die Kalibrierung des zweiten Zählrohrs.
  gmcmap:
    description: Gemeinsame Konto- und Netzwerkeinstellungen für öffentliche Uploads. Die Zähler-ID bleibt 
      gerätespezifisch.
    fields:
      account_id:
        description: GMCMap-Benutzer-ID aus dem registrierten GMCMap-Konto. Wird weder protokolliert noch in 
          Diagnoseexporten gespeichert.
        name: Benutzer-ID (AID)
      enabled:
        description: Sendet Messwerte optional an die öffentliche GMCMap-Weltkarte. Standardmäßig deaktiviert.
        name: Öffentliche Übertragung aktivieren
      privacy_confirmed:
        description: Muss aktiviert sein, bevor Daten gesendet werden. Standort und Stationsangaben werden im 
          GMCMap-Konto verwaltet und können öffentlich sichtbar sein.
        name: Öffentliche Datenübertragung bestätigen
      timeout:
        description: Maximale Wartezeit pro GMCMap-Anfrage in Sekunden. Fehler werden im Hintergrund mit 
          Rückoff wiederholt.
        name: Netzwerk-Timeout
      upload_interval:
        description: Sekunden zwischen öffentlichen Übertragungen je Gerät. Empfohlen sind mindestens 120 bis 
          300 Sekunden.
        name: Uploadintervall
    name: GMCMap (gemeinsam)
  history:
    description: Gemeinsame Aufbewahrung, Berichtszeitzone und geschützte Historienverwaltung.
    fields:
      history_management_enabled:
        description: Aktiviert die geschützten Funktionen zum Wiederherstellen und vollständigen Löschen in 
          der App. Im Normalbetrieb deaktiviert lassen und nur für geplante Arbeiten an der Historie 
          einschalten.
        name: Historienverwaltung
      report_timezone:
        description: IANA-Zeitzone für Tagesgrenzen und Zeitstempel, z. B. Europe/Berlin.
        name: Zeitzone der Berichte
      retention_days:
        description: Tage, die Messungen lokal in SQLite gespeichert bleiben.
        name: Aufbewahrungsdauer
    name: Verlauf und Sicherung
  interface:
    description: Gemeinsame Sprache, Ansichtsart und MQTT-Darstellung.
    fields:
      custom_value_font_size_px:
        description: "Schriftgröße in Pixeln (20–64). Wird nur bei „Benutzerdefiniert“ verwendet."
        name: "Benutzerdefinierte Schriftgröße"
      main_value_size:
        description: "Legt die Standardgröße des Hauptmesswerts fest: klein, mittel, groß oder benutzerdefiniert."
        name: "Hauptmesswert Schriftgröße"
      publish_advanced_sensors:
        description: Statistik-, Basislinien- und Alarmwerte per MQTT Discovery veröffentlichen.
        name: Erweiterte MQTT-Sensoren
      ui_language:
        description: Auto folgt der Browsersprache.
        name: Sprache der Oberfläche
      ui_mode:
        description: Einfach zeigt Kernwerte; Erweitert zeigt Analysen, Wartung und Exporte.
        name: Berichtsansicht
    name: Oberfläche
  safety:
    description: Gemeinsames Grenzwertprofil und benutzerdefinierte Warnstufen.
    fields:
      danger_cpm:
        description: Beginn der roten Stufe. Muss über der Warnschwelle liegen.
        name: 'Benutzerdefiniert: Gefahr in CPM'
      danger_usvh:
        description: Beginn der roten Stufe für die abgeleitete Dosisleistung.
        name: 'Benutzerdefiniert: Gefahr in µSv/h'
      profile:
        description: GQ nutzt Herstellerbänder. BfS- und ICRP-Referenz projizieren 1 bzw. 20 mSv/Jahr 
          mathematisch auf kontinuierliche Dosisleistung; sie sind keine amtlichen Sofort-Alarmgrenzen. 
          Benutzerdefiniert nutzt die Felder darunter.
        name: Grenzwertprofil
      threshold_basis:
        description: CPM, abgeleitete Dosisleistung oder der jeweils strengere Status. Nur bei 
          Benutzerdefiniert wirksam.
        name: Auswertung im benutzerdefinierten Profil
      warning_cpm:
        description: Beginn der gelben Stufe. Nur im Profil Benutzerdefiniert wirksam.
        name: 'Benutzerdefiniert: Warnung in CPM'
      warning_usvh:
        description: Beginn der gelben Stufe für die abgeleitete Dosisleistung.
        name: 'Benutzerdefiniert: Warnung in µSv/h'
    name: Sicherheitsbewertung
  system:
    description: Gemeinsame technische Einstellungen für das gesamte Add-on.
    fields:
      bridge_heartbeat_interval_seconds:
        description: Intervall in Sekunden, in dem der Erfassungsdienst seinen eigenen Lebensstatus atomar in /data aktualisiert.
        name: Bridge-Heartbeat-Intervall
      health_startup_grace_seconds:
        description: Schonzeit nach dem Start, bevor fehlende Geräte oder Messwerte als kritischer Fehler gelten.
        name: Health-Startschonzeit
      health_bridge_warning_seconds:
        description: Alter des Bridge-Heartbeats in Sekunden, ab dem der Health-Check eine Warnung meldet.
        name: Bridge-Heartbeat Warnschwelle
      health_bridge_error_seconds:
        description: Alter des Bridge-Heartbeats in Sekunden, ab dem der Health-Check einen kritischen Fehler meldet.
        name: Bridge-Heartbeat Fehlerschwelle
      health_measurement_warning_seconds:
        description: Alter des letzten Messwerts in Sekunden, ab dem eine Warnung ausgegeben wird.
        name: Messwertalter Warnschwelle
      health_measurement_error_seconds:
        description: Alter des letzten Messwerts in Sekunden, ab dem ein kritischer Fehler ausgegeben wird.
        name: Messwertalter Fehlerschwelle
      log_level:
        description: Detailgrad der Add-on-Protokolle.
        name: Protokollierungsstufe
      serial_scheduler_enabled:
