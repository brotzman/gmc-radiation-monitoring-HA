  gmcmap:
    description: Shared public-upload account and network settings. The counter ID remains device-specific.
    fields:
      account_id:
        description: GMCMap user ID from the registered GMCMap account. It is not logged or stored in 
          diagnostic exports.
        name: User ID (AID)
      enabled:
        description: Optionally send measurements to the public GMCMap world map. Disabled by default.
        name: Enable public uploads
      privacy_confirmed:
        description: Must be enabled before data is sent. Location and station details are managed in the 
          GMCMap account and may be publicly visible.
        name: Confirm public data transfer
      timeout:
        description: Maximum wait per GMCMap request in seconds. Failures are retried in the background with 
          backoff.
        name: Network timeout
      upload_interval:
        description: Seconds between public uploads for each device. At least 120 to 300 seconds is 
          recommended.
        name: Upload interval
    name: GMCMap (shared)
  history:
    description: Shared local retention, report time zone and protected history-management controls.
    fields:
      history_management_enabled:
        description: Enable the protected restore and complete-deletion tools in the app. Keep disabled during
          normal operation and enable only for planned history maintenance.
        name: History management
      report_timezone:
        description: IANA time zone for day boundaries and timestamps, e.g. Europe/Berlin.
        name: Report time zone
      retention_days:
        description: Days for which measurements remain in local SQLite storage.
        name: History retention
    name: History and backup
  interface:
    description: Shared dashboard language, view mode and MQTT presentation settings.
    fields:
      publish_advanced_sensors:
        description: Expose statistics, baseline and alert values through MQTT Discovery.
        name: Publish advanced MQTT sensors
      ui_language:
        description: Auto follows the browser language.
        name: Interface language
      ui_mode:
        description: Simple shows core values; Advanced adds analysis, maintenance and exports.
        name: Report view
    name: Interface
  safety:
    description: Shared absolute threshold profile and custom warning levels.
    fields:
      danger_cpm:
        description: Start of red. Must exceed the warning threshold.
        name: Custom danger CPM
      danger_usvh:
        description: Start of red for derived dose rate.
        name: Custom danger µSv/h
      profile:
        description: GQ uses manufacturer bands. BfS and ICRP references mathematically annualise 1 and 20 
          mSv/year; they are not official instant alarm limits. Custom uses the fields below.
        name: Threshold profile
      threshold_basis:
        description: Use CPM, derived dose rate, or the stricter result. Effective only for Custom.
        name: Custom profile evaluation
      warning_cpm:
        description: Start of yellow. Effective only for Custom.
        name: Custom warning CPM
      warning_usvh:
        description: Start of yellow for derived dose rate.
        name: Custom warning µSv/h
    name: Safety assessment
  system:
    description: Shared technical settings for the complete add-on.
    fields:
      bridge_heartbeat_interval_seconds:
        description: Interval in seconds at which the acquisition service atomically updates its own liveness record in /data.
        name: Bridge heartbeat interval
      health_startup_grace_seconds:
        description: Grace period after startup before missing devices or measurements become critical errors.
        name: Health startup grace period
      health_bridge_warning_seconds:
        description: Bridge heartbeat age in seconds at which the health check reports a warning.
        name: Bridge heartbeat warning threshold
      health_bridge_error_seconds:
        description: Bridge heartbeat age in seconds at which the health check reports a critical error.
        name: Bridge heartbeat error threshold
      health_measurement_warning_seconds:
        description: Age of the latest measurement in seconds at which a warning is reported.
        name: Measurement age warning threshold
      health_measurement_error_seconds:
        description: Age of the latest measurement in seconds at which a critical error is reported.
        name: Measurement age error threshold
      log_level:
        description: Detail level of add-on logs.
        name: Log level
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: System
