configuration:
  analysis:
    description: Shared baseline, traffic-light and smart-event settings for all devices.
    fields:
      baseline_learning_days:
        description: History days used for the local background baseline.
        name: Baseline learning period
      external_temperature_entity:
        description: Home Assistant sensor used for CPM–temperature correlation when
          the GMC has no internal temperature sensor. The entity ID remains editable.
        name: External temperature entity
      external_temperature_max_age_seconds:
        description: Older Home Assistant temperature states are not used for correlation.
        name: Maximum external temperature age
      external_temperature_name:
        description: Friendly-name fallback used to locate the temperature sensor
          when the configured entity ID differs or was renamed.
        name: External temperature search name
      cosmic_hint_enabled:
        description: Learn a cautious air-pressure-related background signature. This
          is a statistical hint only and never suppresses radiation warnings.
        name: Cosmic-influence statistical hint
      pressure_weather_entity_primary:
        description: Primary Home Assistant weather entity used for current air pressure.
        name: Primary pressure weather entity
      pressure_weather_entity_secondary:
        description: Optional second weather entity used to plausibility-check the
          pressure value.
        name: Secondary pressure weather entity
      pressure_weather_source_name:
        description: Provider name shown with the pressure source.
        name: Pressure source provider
      pressure_weather_max_age_seconds:
        description: Weather pressure states older than this are excluded from learning.
        name: Maximum pressure-state age
      pressure_weather_max_difference_hpa:
        description: Maximum allowed difference between both pressure sources before
          the value is rejected.
        name: Maximum pressure-source difference
      rapid_rise_percent:
        description: Percentage increase that creates an event within the selected
          window.
        name: Rapid-rise threshold
      rapid_rise_window_minutes:
        description: Comparison period in minutes.
        name: Rapid-rise window
      smart_alerts_enabled:
        description: Detect rapid rises, sustained elevation and return to normal.
        name: Smart events
      sustained_alert_minutes:
        description: Minutes above the learned baseline before a sustained event.
        name: Sustained elevation
      traffic_light_red_percent:
        description: Red deviation threshold; must exceed yellow. Not a safety limit.
        name: 'Relative light: red'
      traffic_light_yellow_percent:
        description: Percentage deviation of the 1-hour mean from the learned baseline.
          Not a safety limit.
        name: 'Relative light: yellow'
    name: Background analysis
  devices:
    description: Configure every connected GMC independently. Add one entry per physical
      counter.
    fields:
      auxiliary_read_interval:
        description: Seconds between temperature, voltage, dual-tube, device-time
          and gyro reads. CPM still uses the measurement interval; 0 reads auxiliary
          values every cycle.
        name: Auxiliary read interval
      command_timeout:
        description: Maximum wait for a device response in seconds.
        name: Response timeout
      cpm_per_usvh:
        description: Tube-specific conversion factor for this device.
        name: CPM per µSv/h
      device_clock_warning_seconds:
        description: Allowed clock offset in seconds.
        name: Device clock warning threshold
      gmcmap_counter_id:
        description: Dedicated public GMCMap counter ID for this device.
        name: GMCMap counter ID
      heartbeat_enabled:
        description: Enable live CPS for this device when supported.
        name: Enable 1 Hz heartbeat
      inter_command_delay_ms:
        description: Pause between device commands in milliseconds.
        name: Command spacing
      name:
        description: Unique name for Home Assistant and the shared dashboard, e.g.
          Basement.
        name: Display name
      read_device_time:
        description: Read this GMC clock when supported.
        name: Read device clock
      read_gyro:
        description: Request optional gyro data for this device.
        name: Read gyro diagnostics
      scan_interval:
        description: Seconds between persistently stored measurements for this device.
        name: Measurement interval
      serial_debug:
        description: Log bounded TX/RX hexadecimal and ASCII previews for this device.
          Enable only while diagnosing.
        name: Serial frame debug
      serial_debug_max_bytes:
        description: Maximum number of bytes shown for each TX/RX frame.
        name: Debug frame byte limit
      serial_startup_delay:
        description: Startup offset in seconds before this device is initialized.
          Larger configured values are preserved and consecutive devices are always
          separated by at least 15 seconds.
        name: Serial startup delay
      orientation_calibration_enabled:
        name: Orientation calibration
        description: Use the configured offsets and scales for roll, pitch and inclination.
      orientation_calibration_serial:
        name: Calibration device serial
        description: Serial number to which this calibration belongs.
      orientation_offset_x:
        name: Orientation X offset
        description: Raw X-axis zero offset from the six-position calibration.
      orientation_offset_y:
        name: Orientation Y offset
        description: Raw Y-axis zero offset from the six-position calibration.
      orientation_offset_z:
        name: Orientation Z offset
        description: Raw Z-axis zero offset from the six-position calibration.
      orientation_scale_x:
        name: Orientation X scale
        description: Raw X-axis counts corresponding to 1 g.
      orientation_scale_y:
        name: Orientation Y scale
        description: Raw Y-axis counts corresponding to 1 g.
      orientation_scale_z:
        name: Orientation Z scale
        description: Raw Z-axis counts corresponding to 1 g.
      orientation_calibration_name:
        name: Calibration profile name
        description: Name shown with the calculated orientation values.
    name: Devices
  gmcmap:
    description: Shared public-upload account and network settings. The counter ID
      remains device-specific.
    fields:
      account_id:
        description: GMCMap user ID from the registered GMCMap account. It is not
          logged or stored in diagnostic exports.
        name: User ID (AID)
      enabled:
        description: Optionally send measurements to the public GMCMap world map.
          Disabled by default.
        name: Enable public uploads
      privacy_confirmed:
        description: Must be enabled before data is sent. Location and station details
          are managed in the GMCMap account and may be publicly visible.
        name: Confirm public data transfer
      timeout:
        description: Maximum wait per GMCMap request in seconds. Failures are retried
          in the background with backoff.
        name: Network timeout
      upload_interval:
        description: Seconds between public uploads for each device. At least 120
          to 300 seconds is recommended.
        name: Upload interval
    name: GMCMap (shared)
  history:
    description: Shared local retention, report time zone, restore and complete-deletion controls.
    fields:
      enable_purge_all_history:
        description: Shows the danger card for deleting all GMC data and enables the server-side deletion action. Disabled by default for safety.
        name: Allow complete history deletion
      enable_restore:
        description: Temporarily permit SQLite import. Disabled by default for safety.
        name: Allow restore
      report_timezone:
        description: IANA time zone for day boundaries and timestamps, e.g. Europe/Berlin.
        name: Report time zone
      retention_days:
        description: Days for which measurements remain in local SQLite storage.
        name: History retention
    name: History and backup
  interface:
    description: Shared dashboard language, view mode and MQTT presentation settings.
    fields:
      publish_advanced_sensors:
        description: Expose statistics, baseline and alert values through MQTT Discovery.
        name: Publish advanced MQTT sensors
      ui_language:
        description: Auto follows the browser language.
        name: Interface language
      ui_mode:
        description: Simple shows core values; Advanced adds analysis, maintenance
          and exports.
        name: Report view
    name: Interface
  safety:
    description: Shared absolute threshold profile and custom warning levels.
    fields:
      danger_cpm:
        description: Start of red. Must exceed the warning threshold.
        name: Custom danger CPM
      danger_usvh:
        description: Start of red for derived dose rate.
        name: Custom danger µSv/h
      profile:
        description: GQ uses manufacturer bands. BfS and ICRP references mathematically
          annualise 1 and 20 mSv/year; they are not official instant alarm limits.
          Custom uses the fields below.
        name: Threshold profile
      threshold_basis:
        description: Use CPM, derived dose rate, or the stricter result. Effective
          only for Custom.
        name: Custom profile evaluation
      warning_cpm:
        description: Start of yellow. Effective only for Custom.
        name: Custom warning CPM
      warning_usvh:
        description: Start of yellow for derived dose rate.
        name: Custom warning µSv/h
    name: Safety assessment
  system:
    description: Shared technical settings for the complete add-on.
    fields:
      log_level:
        description: Detail level of add-on logs.
        name: Log level
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB
          controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: System
