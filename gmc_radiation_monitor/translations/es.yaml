configuration:
  analysis:
    description: Ajustes comunes de línea base, semáforo y eventos para todos los dispositivos.
    fields:
      baseline_learning_days:
        description: Días de historial usados para la base de fondo local.
        name: Periodo de aprendizaje de referencia
      external_temperature_entity:
        description: Home Assistant sensor used for CPM–temperature correlation when the GMC has no internal temperature sensor. The entity ID remains editable.
        name: External temperature entity
      external_temperature_max_age_seconds:
        description: Older Home Assistant temperature states are not used for correlation.
        name: Maximum external temperature age
      external_temperature_name:
        description: Friendly-name fallback used to locate the temperature sensor when the configured entity ID differs or was renamed.
        name: External temperature search name
      cosmic_hint_enabled:
        description: Aprende una firma de fondo prudente relacionada con la presión. Es solo una indicación estadística y no suprime alertas.
        name: Indicación estadística de influencia cósmica
      pressure_weather_entity_primary:
        description: Entidad meteorológica principal de Home Assistant para la presión actual.
        name: Entidad meteorológica de presión principal
      pressure_weather_entity_secondary:
        description: Segunda entidad opcional para comprobar la plausibilidad de la presión.
        name: Entidad meteorológica de presión secundaria
      pressure_weather_source_name:
        description: Nombre del proveedor mostrado con la fuente de presión.
        name: Proveedor de la fuente de presión
      pressure_weather_max_age_seconds:
        description: Los valores de presión más antiguos se excluyen del aprendizaje.
        name: Antigüedad máxima de la presión
      pressure_weather_max_difference_hpa:
        description: Diferencia máxima permitida entre las dos fuentes de presión.
        name: Diferencia máxima de las fuentes de presión
      rapid_rise_percent:
        description: Aumento porcentual que genera un evento dentro de la ventana elegida.
        name: Umbral de subida rápida
      rapid_rise_window_minutes:
        description: Periodo de comparación en minutos.
        name: Ventana de subida rápida
      smart_alerts_enabled:
        description: Detecta subidas rápidas, elevación sostenida y vuelta a la normalidad.
        name: Eventos inteligentes
      sustained_alert_minutes:
        description: Minutos por encima de la base aprendida antes de generar un evento sostenido.
        name: Elevación sostenida
      traffic_light_red_percent:
        description: Umbral rojo de desviación; debe superar al amarillo. No es un límite de seguridad.
        name: 'Semáforo relativo: rojo'
      traffic_light_yellow_percent:
        description: Desviación porcentual de la media de una hora respecto a la base aprendida. No es un límite de seguridad.
        name: 'Semáforo relativo: amarillo'
    name: Análisis de fondo
  devices:
    description: Configure cada contador GMC conectado de forma independiente. Añada una entrada por dispositivo físico.
    fields:
      auxiliary_read_interval:
        description: Seconds between temperature, voltage, dual-tube, device-time and gyro reads. CPM still uses the measurement interval; 0 reads auxiliary values every cycle.
        name: Auxiliary read interval
      command_timeout:
        description: Espera máxima de respuesta en segundos.
        name: Tiempo de espera de respuesta
      cpm_per_usvh:
        description: Factor de conversión específico del tubo.
        name: CPM por µSv/h
      device_clock_warning_seconds:
        description: Desviación permitida en segundos.
        name: Umbral de aviso del reloj
      gmcmap_counter_id:
        description: ID público de GMCMap dedicado a este dispositivo.
        name: ID de contador GMCMap
      heartbeat_enabled:
        description: Activar CPS en directo si es compatible.
        name: Activar heartbeat de 1 Hz
      inter_command_delay_ms:
        description: Pausa entre comandos en milisegundos.
        name: Separación entre comandos
      name:
        description: Nombre único para Home Assistant y el panel compartido.
        name: Nombre mostrado
      read_device_time:
        description: Leer el reloj de este GMC si es compatible.
        name: Leer reloj del dispositivo
      read_gyro:
        description: Solicitar datos opcionales del giroscopio.
        name: Leer giroscopio
      scan_interval:
        description: Segundos entre mediciones almacenadas.
        name: Intervalo de medición
      serial_debug:
        description: Log bounded TX/RX hexadecimal and ASCII previews for this device. Enable only while diagnosing.
        name: Serial frame debug
      serial_debug_max_bytes:
        description: Maximum number of bytes shown for each TX/RX frame.
        name: Debug frame byte limit
      serial_startup_delay:
        description: Desfase de inicio en segundos antes de inicializar este dispositivo. Se conservan los valores configurados mayores y siempre hay al menos 15 segundos entre dispositivos consecutivos.
        name: Serial startup delay
      orientation_calibration_enabled:
        name: Orientation calibration
        description: Use the configured offsets and scales for roll, pitch and inclination.
      orientation_calibration_serial:
        name: Calibration device serial
        description: Serial number to which this calibration belongs.
      orientation_offset_x:
        name: Orientation X offset
        description: Raw X-axis zero offset from the six-position calibration.
      orientation_offset_y:
        name: Orientation Y offset
        description: Raw Y-axis zero offset from the six-position calibration.
      orientation_offset_z:
        name: Orientation Z offset
        description: Raw Z-axis zero offset from the six-position calibration.
      orientation_scale_x:
        name: Orientation X scale
        description: Raw X-axis counts corresponding to 1 g.
      orientation_scale_y:
        name: Orientation Y scale
        description: Raw Y-axis counts corresponding to 1 g.
      orientation_scale_z:
        name: Orientation Z scale
        description: Raw Z-axis counts corresponding to 1 g.
      orientation_calibration_name:
        name: Calibration profile name
        description: Name shown with the calculated orientation values.
    name: Dispositivos
  gmcmap:
    description: Cuenta y ajustes de red comunes para cargas públicas. El ID del contador sigue siendo específico de cada dispositivo.
    fields:
      account_id:
        description: ID de usuario de la cuenta registrada en GMCMap. No se registra ni se guarda en exportaciones de diagnóstico.
        name: ID de usuario (AID)
      enabled:
        description: Envía opcionalmente las mediciones al mapa mundial público GMCMap. Desactivado de forma predeterminada.
        name: Activar envíos públicos
      privacy_confirmed:
        description: Debe activarse antes de enviar datos. La ubicación y los datos de la estación se gestionan en la cuenta de GMCMap y pueden ser públicos.
        name: Confirmar transferencia pública de datos
      timeout:
        description: Espera máxima por solicitud a GMCMap en segundos. Los errores se reintentan en segundo plano con espera progresiva.
        name: Tiempo de espera de red
      upload_interval:
        description: Segundos entre envíos públicos por dispositivo. Se recomiendan al menos 120 a 300 segundos.
        name: Intervalo de envío
    name: GMCMap (compartido)
  history:
    description: Retención local, zona horaria de informes y controles protegidos de gestión del historial.
    fields:
      history_management_enabled:
        description: Activa las herramientas protegidas para restaurar y eliminar completamente el historial. Manténgalo desactivado durante el funcionamiento normal.
        name: Gestión del historial
      report_timezone:
        description: Zona IANA para límites diarios y marcas de tiempo, por ejemplo Europe/Madrid.
        name: Zona horaria de informes
      retention_days:
        description: Días que se conservan las mediciones en SQLite.
        name: Retención del historial
    name: Historial y copia de seguridad
  interface:
    description: Idioma, modo de vista y presentación MQTT compartidos.
    fields:
      publish_advanced_sensors:
        description: Publica estadísticas, base y alertas mediante MQTT Discovery.
        name: Publicar sensores MQTT avanzados
      ui_language:
        description: Auto sigue el idioma del navegador.
        name: Idioma de la interfaz
      ui_mode:
        description: Simple muestra lo esencial; Avanzado añade análisis, mantenimiento y exportaciones.
        name: Vista de informes
    name: Interfaz
  safety:
    description: Perfil de umbrales absolutos y niveles de aviso personalizados compartidos.
    fields:
      danger_cpm:
        description: Inicio de la zona roja. Debe superar el umbral de aviso.
        name: Peligro CPM personalizado
      danger_usvh:
        description: Inicio de la zona roja para la tasa derivada.
        name: Peligro µSv/h personalizado
      profile:
        description: GQ usa las bandas del fabricante. Las referencias BfS e ICRP convierten matemáticamente 1 y 20 mSv/año en una tasa continua; no son umbrales oficiales instantáneos. Personalizado usa los campos siguientes.
        name: Perfil de umbrales
      threshold_basis:
        description: Usa CPM, tasa derivada o el resultado más estricto. Solo funciona con Personalizado.
        name: Evaluación del perfil personalizado
      warning_cpm:
        description: Inicio de la zona amarilla. Solo funciona con Personalizado.
        name: Aviso CPM personalizado
      warning_usvh:
        description: Inicio de la zona amarilla para la tasa derivada.
        name: Aviso µSv/h personalizado
    name: Evaluación de seguridad
  system:
    description: Ajustes técnicos compartidos para todo el complemento.
    fields:
      log_level:
        description: Nivel de detalle de los registros del complemento.
        name: Nivel de registro
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: Sistema
