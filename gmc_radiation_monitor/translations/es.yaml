All GMC history was deleted: Se eliminó todo el historial de GMC
Another report or maintenance job is running: Se está ejecutando otro informe o trabajo de mantenimiento.
Complete history deletion failed: Error al eliminar el historial completo
Danger zone: Zona de peligro
Delete all GMC history: Eliminar todo el historial de GMC
Deletion confirmation text must be exactly DELETE ALL GMC HISTORY: El texto de confirmación de eliminación 
  debe ser exactamente DELETE ALL GMC HISTORY
History deleted: Historial eliminado
Invalid deletion confirmation: Confirmación de eliminación no válida
? Permanently delete all GMC history from this app and Home Assistant Recorder. This includes CPM, 
  temperature, voltage, gyro and tube measurements for every known GMC and all time periods.
: Elimina permanentemente todo el historial de GMC de esta aplicación y de la grabadora Home Assistant. Esto 
  incluye mediciones de CPM, temperatura, voltaje, giroscopio y tubo para cada GMC conocido y todos los 
  períodos de tiempo.
This cannot be undone. Delete all GMC history?: Esto no se puede deshacer. ¿Eliminar todo el historial de GMC?
Type DELETE ALL GMC HISTORY to confirm: Escriba DELETE ALL GMC HISTORY para confirmar
configuration:
  analysis:
    description: Ajustes comunes de línea base, semáforo y eventos para todos los dispositivos.
    fields:
      baseline_learning_days:
        description: Días de historial usados para la base de fondo local.
        name: Periodo de aprendizaje de referencia
      external_temperature_entity:
        description: Sensor de Home Assistant utilizado para correlacionar CPM y temperatura cuando el GMC no 
          dispone de sensor de temperatura interno. El ID de la entidad sigue siendo editable.
        name: Entidad de temperatura externa
      external_temperature_max_age_seconds:
        description: Los estados de temperatura antiguos de Home Assistant no se utilizan para la correlación.
        name: Antigüedad máxima de la temperatura externa
      external_temperature_name:
        description: Nombre descriptivo alternativo utilizado para localizar el sensor de temperatura cuando 
          el ID de entidad configurado es distinto o se ha cambiado.
        name: Nombre de búsqueda de temperatura externa
      cosmic_hint_enabled:
        description: Aprende una firma de fondo prudente relacionada con la presión. Es solo una indicación 
          estadística y no suprime alertas.
        name: Indicación estadística de influencia cósmica
      pressure_weather_entity_primary:
        description: Entidad meteorológica principal de Home Assistant para la presión actual.
        name: Entidad meteorológica de presión principal
      pressure_weather_entity_secondary:
        description: Segunda entidad opcional para comprobar la plausibilidad de la presión.
        name: Entidad meteorológica de presión secundaria
      pressure_weather_source_name:
        description: Nombre del proveedor mostrado con la fuente de presión.
        name: Proveedor de la fuente de presión
      pressure_weather_max_age_seconds:
        description: Los valores de presión más antiguos se excluyen del aprendizaje.
        name: Antigüedad máxima de la presión
      pressure_weather_max_difference_hpa:
        description: Diferencia máxima permitida entre las dos fuentes de presión.
        name: Diferencia máxima de las fuentes de presión
      rapid_rise_percent:
        description: Aumento porcentual que genera un evento dentro de la ventana elegida.
        name: Umbral de subida rápida
      rapid_rise_window_minutes:
        description: Periodo de comparación en minutos.
        name: Ventana de subida rápida
      smart_alerts_enabled:
        description: Detecta subidas rápidas, elevación sostenida y vuelta a la normalidad.
        name: Eventos inteligentes
      sustained_alert_minutes:
        description: Minutos por encima de la base aprendida antes de generar un evento sostenido.
        name: Elevación sostenida
      traffic_light_red_percent:
        description: Umbral rojo de desviación; debe superar al amarillo. No es un límite de seguridad.
        name: 'Semáforo relativo: rojo'
      traffic_light_yellow_percent:
        description: Desviación porcentual de la media de una hora respecto a la base aprendida. No es un 
          límite de seguridad.
        name: 'Semáforo relativo: amarillo'
    name: Análisis de fondo
  devices:
    description: Configuración completa para GMC-300, GMC-320, GMC-600/600+ y otros contadores con un único 
      tubo físico. Aquí no se muestran controles de doble tubo.
    fields:
      auxiliary_read_interval:
