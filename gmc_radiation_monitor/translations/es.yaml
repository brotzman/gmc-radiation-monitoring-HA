    description: Idioma, modo de vista y presentación MQTT compartidos.
    fields:
      publish_advanced_sensors:
        description: Publica estadísticas, base y alertas mediante MQTT Discovery.
        name: Publicar sensores MQTT avanzados
      ui_language:
        description: Auto sigue el idioma del navegador.
        name: Idioma de la interfaz
      ui_mode:
        description: Simple muestra lo esencial; Avanzado añade análisis, mantenimiento y exportaciones.
        name: Vista de informes
    name: Interfaz
  safety:
    description: Perfil de umbrales absolutos y niveles de aviso personalizados compartidos.
    fields:
      danger_cpm:
        description: Inicio de la zona roja. Debe superar el umbral de aviso.
        name: Peligro CPM personalizado
      danger_usvh:
        description: Inicio de la zona roja para la tasa derivada.
        name: Peligro µSv/h personalizado
      profile:
        description: GQ usa las bandas del fabricante. Las referencias BfS e ICRP convierten matemáticamente 1
          y 20 mSv/año en una tasa continua; no son umbrales oficiales instantáneos. Personalizado usa los 
          campos siguientes.
        name: Perfil de umbrales
      threshold_basis:
        description: Usa CPM, tasa derivada o el resultado más estricto. Solo funciona con Personalizado.
        name: Evaluación del perfil personalizado
      warning_cpm:
        description: Inicio de la zona amarilla. Solo funciona con Personalizado.
        name: Aviso CPM personalizado
      warning_usvh:
        description: Inicio de la zona amarilla para la tasa derivada.
        name: Aviso µSv/h personalizado
    name: Evaluación de seguridad
  system:
    description: Ajustes técnicos compartidos para todo el complemento.
    fields:
      bridge_heartbeat_interval_seconds:
        description: Intervalo en segundos con el que el servicio de adquisición actualiza de forma atómica su estado de actividad en /data.
        name: Intervalo de latido del bridge
      health_startup_grace_seconds:
        description: Periodo de gracia tras el inicio antes de que la falta de dispositivos o mediciones sea un error crítico.
        name: Gracia de inicio de salud
      health_bridge_warning_seconds:
        description: Antigüedad del latido del bridge en segundos a partir de la cual se muestra una advertencia.
        name: Umbral de advertencia del bridge
      health_bridge_error_seconds:
        description: Antigüedad del latido del bridge en segundos a partir de la cual se muestra un error crítico.
        name: Umbral de error del bridge
      health_measurement_warning_seconds:
        description: Antigüedad de la última medición en segundos a partir de la cual se muestra una advertencia.
        name: Umbral de advertencia de medición
      health_measurement_error_seconds:
        description: Antigüedad de la última medición en segundos a partir de la cual se muestra un error crítico.
        name: Umbral de error de medición
      log_level:
        description: Nivel de detalle de los registros del complemento.
        name: Nivel de registro
      serial_scheduler_enabled:
        description: Serializa las ventanas de comandos de los contadores que comparten el controlador USB del
          host.
        name: Planificador serie compartido
      serial_scheduler_gap_seconds:
        description: Tiempo de espera en segundos entre las ventanas de comandos de distintos contadores.
        name: Pausa del planificador
    name: Sistema
