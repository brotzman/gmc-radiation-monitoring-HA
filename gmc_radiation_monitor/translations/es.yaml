  gmcmap:
    description: Cuenta y ajustes de red comunes para cargas públicas. El ID del contador sigue siendo 
      específico de cada dispositivo.
    fields:
      account_id:
        description: ID de usuario de la cuenta registrada en GMCMap. No se registra ni se guarda en 
          exportaciones de diagnóstico.
        name: ID de usuario (AID)
      enabled:
        description: Envía opcionalmente las mediciones al mapa mundial público GMCMap. Desactivado de forma 
          predeterminada.
        name: Activar envíos públicos
      privacy_confirmed:
        description: Debe activarse antes de enviar datos. La ubicación y los datos de la estación se 
          gestionan en la cuenta de GMCMap y pueden ser públicos.
        name: Confirmar transferencia pública de datos
      timeout:
        description: Espera máxima por solicitud a GMCMap en segundos. Los errores se reintentan en segundo 
          plano con espera progresiva.
        name: Tiempo de espera de red
      upload_interval:
