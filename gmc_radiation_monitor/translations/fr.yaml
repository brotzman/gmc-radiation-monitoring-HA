All GMC history was deleted: Tout l'historique GMC a été supprimé
Another report or maintenance job is running: Un autre travail de rapport ou de maintenance est en cours d'exécution
Complete history deletion failed: La suppression complète de l'historique a échoué
Danger zone: Zone dangereuse
Delete all GMC history: Supprimer tout l'historique GMC
Deletion confirmation text must be exactly DELETE ALL GMC HISTORY: Le texte de confirmation de suppression doit
  être exactement DELETE ALL GMC HISTORY
History deleted: Historique supprimé
Invalid deletion confirmation: Confirmation de suppression invalide
? Permanently delete all GMC history from this app and Home Assistant Recorder. This includes CPM, temperature,
  voltage, gyro and tube measurements for every known GMC and all time periods.
: Supprimez définitivement tout l'historique GMC de cette application et de l'enregistreur Home Assistant. Cela
  inclut les mesures du CPM, de la température, de la tension, du gyroscope et du tube pour chaque GMC connu et
  toutes les périodes.
This cannot be undone. Delete all GMC history?: Cela ne peut pas être annulé. Supprimer tout l'historique GMC ?
Type DELETE ALL GMC HISTORY to confirm: Saisissez DELETE ALL GMC HISTORY pour confirmer
configuration:
  analysis:
    description: Paramètres communs de référence, de signalisation et d’événements pour tous les appareils.
    fields:
      baseline_learning_days:
        description: Nombre de jours d’historique utilisés pour le niveau de fond local.
        name: Période d’apprentissage de la référence
      external_temperature_entity:
        description: Capteur Home Assistant utilisé pour la corrélation CPM-température lorsque le GMC ne possède
          pas de capteur de température interne. L’identifiant de l’entité reste modifiable.
        name: Entité de température extérieure
      external_temperature_max_age_seconds:
        description: Les anciens états de température Home Assistant ne sont pas utilisés pour la corrélation.
        name: Âge maximal de la température extérieure
      external_temperature_name:
        description: Nom convivial de secours utilisé pour localiser le capteur de température lorsque l’identifiant
          d’entité configuré diffère ou a été renommé.
        name: Nom de recherche de la température extérieure
      cosmic_hint_enabled:
        description: Apprend une signature de fond prudente liée à la pression. Indication statistique uniquement,
          sans suppression des alertes.
        name: Indication statistique d’influence cosmique
      pressure_weather_entity_primary:
        description: Entité météo Home Assistant principale pour la pression actuelle.
        name: Entité météo de pression principale
      pressure_weather_entity_secondary:
        description: Deuxième entité météo facultative pour vérifier la plausibilité de la pression.
        name: Entité météo de pression secondaire
      pressure_weather_source_name:
        description: Nom du fournisseur affiché avec la source de pression.
        name: Fournisseur de la source de pression
      pressure_weather_max_age_seconds:
        description: Les valeurs de pression plus anciennes sont exclues de l’apprentissage.
        name: Âge maximal de la pression
      pressure_weather_max_difference_hpa:
        description: Différence maximale autorisée entre les deux sources de pression.
        name: Écart maximal des sources de pression
      rapid_rise_percent:
        description: Augmentation en pourcentage déclenchant un événement dans la fenêtre choisie.
        name: Seuil de hausse rapide
      rapid_rise_window_minutes:
        description: Période de comparaison en minutes.
        name: Fenêtre de hausse rapide
      smart_alerts_enabled:
        description: Détecte les hausses rapides, les niveaux durablement élevés et le retour à la normale.
        name: Événements intelligents
      sustained_alert_minutes:
        description: Minutes au-dessus de la référence apprise avant un événement persistant.
        name: Élévation persistante
      traffic_light_red_percent:
        description: Seuil rouge d’écart; doit être supérieur au jaune. Ce n’est pas une limite de sécurité.
        name: 'Voyant relatif : rouge'
      traffic_light_yellow_percent:
        description: Écart en pourcentage de la moyenne sur une heure par rapport à la référence apprise. Ce n’est
          pas une limite de sécurité.
        name: 'Voyant relatif : jaune'
    name: Analyse du bruit de fond
  devices:
    description: Configurez chaque compteur GMC connecté séparément. Ajoutez une entrée par appareil physique.
    fields:
      auxiliary_read_interval:
        description: Secondes entre les lectures de température, tension, double tube, horloge de l’appareil et
          gyroscope. Le CPM continue d’utiliser l’intervalle de mesure ; 0 lit les valeurs auxiliaires à chaque
          cycle.
        name: Intervalle de lecture auxiliaire
      command_timeout:
        description: Attente maximale d’une réponse en secondes.
        name: Délai de réponse
      cpm_per_usvh:
        description: Facteur de conversion propre au tube.
        name: CPM par µSv/h
      device_clock_warning_seconds:
        description: Écart horaire autorisé en secondes.
        name: Seuil d’alerte de l’horloge
      gmcmap_counter_id:
        description: Identifiant GMCMap public propre à cet appareil.
        name: Identifiant de compteur GMCMap
      heartbeat_enabled:
        description: Activer les CPS en direct si pris en charge.
        name: Activer le heartbeat 1 Hz
      inter_command_delay_ms:
        description: Pause entre les commandes en millisecondes.
        name: Espacement des commandes
      name:
        description: Nom unique dans Home Assistant et le tableau de bord.
        name: Nom d’affichage
      read_device_time:
        description: Lire l’horloge de cet appareil si elle est prise en charge.
        name: Lire l’horloge
      read_gyro:
        description: Lire les données gyroscopiques facultatives.
        name: Lire le gyroscope
      scan_interval:
        description: Secondes entre les mesures enregistrées.
        name: Intervalle de mesure
      serial_debug:
        description: Consigner des aperçus hexadécimaux et ASCII limités des trames TX/RX pour cet appareil. À activer
          uniquement pour le diagnostic.
        name: Débogage des trames série
      serial_debug_max_bytes:
        description: Nombre maximal d’octets affichés pour chaque trame TX/RX.
        name: Limite d’octets des trames de débogage
      serial_startup_delay:
        description: Décalage de démarrage en secondes avant l’initialisation de cet appareil. Les valeurs configurées
          plus grandes sont conservées et au moins 15 secondes séparent toujours deux appareils consécutifs.
        name: Délai de démarrage série
      orientation_calibration_enabled:
        name: Étalonnage de l’orientation
        description: Utiliser les décalages et échelles configurés pour le roulis, le tangage et l’inclinaison.
      orientation_calibration_serial:
        name: Numéro de série de l’appareil étalonné
        description: Numéro de série auquel appartient cet étalonnage.
      orientation_offset_x:
        name: Décalage X de l’orientation
        description: Décalage brut du zéro de l’axe X issu de l’étalonnage en six positions.
      orientation_offset_y:
        name: Décalage Y de l’orientation
        description: Décalage brut du zéro de l’axe Y issu de l’étalonnage en six positions.
      orientation_offset_z:
        name: Décalage Z de l’orientation
        description: Décalage brut du zéro de l’axe Z issu de l’étalonnage en six positions.
      orientation_scale_x:
        name: Échelle X de l’orientation
        description: Comptage brut de l’axe X correspondant à 1 g.
      orientation_scale_y:
        name: Échelle Y de l’orientation
        description: Comptage brut de l’axe Y correspondant à 1 g.
      orientation_scale_z:
        name: Échelle Z de l’orientation
        description: Comptage brut de l’axe Z correspondant à 1 g.
      orientation_calibration_name:
        name: Nom du profil d’étalonnage
        description: Nom affiché avec les valeurs d’orientation calculées.
    name: Appareils
  gmcmap:
    description: Compte et paramètres réseau communs pour les envois publics. L’identifiant du compteur reste propre
      à chaque appareil.
    fields:
      account_id:
        description: Identifiant utilisateur du compte GMCMap enregistré. Il n’est ni journalisé ni stocké dans
          les exports de diagnostic.
        name: Identifiant utilisateur (AID)
      enabled:
        description: Envoie facultativement les mesures vers la carte mondiale publique GMCMap. Désactivé par défaut.
        name: Activer les envois publics
      privacy_confirmed:
        description: Doit être activé avant tout envoi. L’emplacement et les informations de station sont gérés
          dans le compte GMCMap et peuvent être publics.
        name: Confirmer le transfert public des données
      timeout:
        description: Attente maximale par requête GMCMap en secondes. Les échecs sont réessayés en arrière-plan
          avec temporisation progressive.
        name: Délai d’attente réseau
      upload_interval:
        description: Secondes entre les envois publics pour chaque appareil. Un intervalle d’au moins 120 à 300
          secondes est recommandé.
        name: Intervalle d’envoi
    name: GMCMap (partagé)
  history:
    description: Conservation locale, fuseau horaire des rapports et gestion protégée de l'historique.
    fields:
      history_management_enabled:
        description: Active les outils protégés de restauration et de suppression complète. Laissez cette option
          désactivée en fonctionnement normal.
        name: Gestion de l'historique
      report_timezone:
        description: Fuseau IANA pour les limites journalières et les horodatages, par exemple Europe/Paris.
        name: Fuseau horaire des rapports
      retention_days:
        description: Nombre de jours de conservation des mesures dans SQLite.
        name: Conservation de l’historique
    name: Historique et sauvegarde
  interface:
    description: Langue, mode d’affichage et présentation MQTT communs.
    fields:
      publish_advanced_sensors:
        description: Publie les statistiques, la référence et les alertes via MQTT Discovery.
        name: Publier les capteurs MQTT avancés
      ui_language:
        description: Auto suit la langue du navigateur.
        name: Langue de l’interface
      ui_mode:
        description: Simple affiche l’essentiel; Avancé ajoute analyses, maintenance et exports.
        name: Vue des rapports
    name: Interface
  safety:
    description: Profil de seuils absolus et niveaux d’alerte personnalisés communs.
    fields:
      danger_cpm:
        description: Début de la zone rouge. Doit dépasser le seuil d’avertissement.
        name: Danger CPM personnalisé
      danger_usvh:
        description: Début de la zone rouge pour le débit dérivé.
        name: Danger µSv/h personnalisé
      profile:
        description: GQ utilise les bandes du fabricant. Les références BfS et ICRP convertissent mathématiquement
          1 et 20 mSv/an en débit continu; ce ne sont pas des seuils instantanés officiels. Personnalisé utilise
          les champs ci-dessous.
        name: Profil de seuils
      threshold_basis:
        description: Utilise les CPM, le débit dérivé ou le résultat le plus strict. Actif uniquement avec Personnalisé.
        name: Évaluation du profil personnalisé
      warning_cpm:
        description: Début de la zone jaune. Actif uniquement avec Personnalisé.
        name: Avertissement CPM personnalisé
      warning_usvh:
        description: Début de la zone jaune pour le débit dérivé.
        name: Avertissement µSv/h personnalisé
    name: Évaluation de sécurité
  system:
    description: Paramètres techniques communs à l’ensemble du module.
    fields:
      log_level:
        description: Niveau de détail des journaux du module.
        name: Niveau de journalisation
      serial_scheduler_enabled:
        description: Sérialiser les fenêtres de commande des compteurs partageant le contrôleur USB de l’hôte.
        name: Planificateur série partagé
      serial_scheduler_gap_seconds:
        description: Temps de silence en secondes entre les fenêtres de commande de compteurs différents.
        name: Intervalle silencieux du planificateur
    name: Système
'{count} measurements and {events} events were removed.': Les mesures {count} et les événements {events} ont été
  supprimés.
? All downloads below automatically use the GMC device currently shown in Analysis. Select another connected device
  above to change the report source.
: Tous les téléchargements ci-dessous utilisent automatiquement l’appareil GMC actuellement affiché dans l’analyse.
  Sélectionnez un autre appareil connecté ci-dessus pour modifier la source du rapport.
No connected GMC device: Aucun appareil GMC connecté
Reports for the displayed analysis: Rapports pour l'analyse affichée
