configuration:
  analysis:
    description: Paramètres communs de référence, de signalisation et d’événements
      pour tous les appareils.
    fields:
      baseline_learning_days:
        description: Nombre de jours d’historique utilisés pour le niveau de fond
          local.
        name: Période d’apprentissage de la référence
      external_temperature_entity:
        description: Home Assistant sensor used for CPM–temperature correlation when
          the GMC has no internal temperature sensor. The entity ID remains editable.
        name: External temperature entity
      external_temperature_max_age_seconds:
        description: Older Home Assistant temperature states are not used for correlation.
        name: Maximum external temperature age
      external_temperature_name:
        description: Friendly-name fallback used to locate the temperature sensor
          when the configured entity ID differs or was renamed.
        name: External temperature search name
      cosmic_hint_enabled:
        description: Apprend une signature de fond prudente liée à la pression. Indication
          statistique uniquement, sans suppression des alertes.
        name: Indication statistique d’influence cosmique
      pressure_weather_entity_primary:
        description: Entité météo Home Assistant principale pour la pression actuelle.
        name: Entité météo de pression principale
      pressure_weather_entity_secondary:
        description: Deuxième entité météo facultative pour vérifier la plausibilité
          de la pression.
        name: Entité météo de pression secondaire
      pressure_weather_source_name:
        description: Nom du fournisseur affiché avec la source de pression.
        name: Fournisseur de la source de pression
      pressure_weather_max_age_seconds:
        description: Les valeurs de pression plus anciennes sont exclues de l’apprentissage.
        name: Âge maximal de la pression
      pressure_weather_max_difference_hpa:
        description: Différence maximale autorisée entre les deux sources de pression.
        name: Écart maximal des sources de pression
      rapid_rise_percent:
        description: Augmentation en pourcentage déclenchant un événement dans la
          fenêtre choisie.
        name: Seuil de hausse rapide
      rapid_rise_window_minutes:
        description: Période de comparaison en minutes.
        name: Fenêtre de hausse rapide
      smart_alerts_enabled:
        description: Détecte les hausses rapides, les niveaux durablement élevés et
          le retour à la normale.
        name: Événements intelligents
      sustained_alert_minutes:
        description: Minutes au-dessus de la référence apprise avant un événement
          persistant.
        name: Élévation persistante
      traffic_light_red_percent:
        description: Seuil rouge d’écart; doit être supérieur au jaune. Ce n’est pas
          une limite de sécurité.
        name: 'Voyant relatif : rouge'
      traffic_light_yellow_percent:
        description: Écart en pourcentage de la moyenne sur une heure par rapport
          à la référence apprise. Ce n’est pas une limite de sécurité.
        name: 'Voyant relatif : jaune'
    name: Analyse du bruit de fond
  devices:
    description: Configurez chaque compteur GMC connecté séparément. Ajoutez une entrée
      par appareil physique.
    fields:
      auxiliary_read_interval:
        description: Seconds between temperature, voltage, dual-tube, device-time
          and gyro reads. CPM still uses the measurement interval; 0 reads auxiliary
          values every cycle.
        name: Auxiliary read interval
      command_timeout:
        description: Attente maximale d’une réponse en secondes.
        name: Délai de réponse
      cpm_per_usvh:
        description: Facteur de conversion propre au tube.
        name: CPM par µSv/h
      device_clock_warning_seconds:
        description: Écart horaire autorisé en secondes.
        name: Seuil d’alerte de l’horloge
      gmcmap_counter_id:
        description: Identifiant GMCMap public propre à cet appareil.
        name: Identifiant de compteur GMCMap
      heartbeat_enabled:
        description: Activer les CPS en direct si pris en charge.
        name: Activer le heartbeat 1 Hz
      inter_command_delay_ms:
        description: Pause entre les commandes en millisecondes.
        name: Espacement des commandes
      name:
        description: Nom unique dans Home Assistant et le tableau de bord.
        name: Nom d’affichage
      read_device_time:
        description: Lire l’horloge de cet appareil si elle est prise en charge.
        name: Lire l’horloge
      read_gyro:
        description: Lire les données gyroscopiques facultatives.
        name: Lire le gyroscope
      scan_interval:
        description: Secondes entre les mesures enregistrées.
        name: Intervalle de mesure
      serial_debug:
        description: Log bounded TX/RX hexadecimal and ASCII previews for this device.
          Enable only while diagnosing.
        name: Serial frame debug
      serial_debug_max_bytes:
        description: Maximum number of bytes shown for each TX/RX frame.
        name: Debug frame byte limit
      serial_startup_delay:
        description: Décalage de démarrage en secondes avant l’initialisation de cet
          appareil. Les valeurs configurées plus grandes sont conservées et au moins
          15 secondes séparent toujours deux appareils consécutifs.
        name: Serial startup delay
      orientation_calibration_enabled:
        name: Orientation calibration
        description: Use the configured offsets and scales for roll, pitch and inclination.
      orientation_calibration_serial:
        name: Calibration device serial
        description: Serial number to which this calibration belongs.
      orientation_offset_x:
        name: Orientation X offset
        description: Raw X-axis zero offset from the six-position calibration.
      orientation_offset_y:
        name: Orientation Y offset
        description: Raw Y-axis zero offset from the six-position calibration.
      orientation_offset_z:
        name: Orientation Z offset
        description: Raw Z-axis zero offset from the six-position calibration.
      orientation_scale_x:
        name: Orientation X scale
        description: Raw X-axis counts corresponding to 1 g.
      orientation_scale_y:
        name: Orientation Y scale
        description: Raw Y-axis counts corresponding to 1 g.
      orientation_scale_z:
        name: Orientation Z scale
        description: Raw Z-axis counts corresponding to 1 g.
      orientation_calibration_name:
        name: Calibration profile name
        description: Name shown with the calculated orientation values.
    name: Appareils
  gmcmap:
    description: Compte et paramètres réseau communs pour les envois publics. L’identifiant
      du compteur reste propre à chaque appareil.
    fields:
      account_id:
        description: Identifiant utilisateur du compte GMCMap enregistré. Il n’est
          ni journalisé ni stocké dans les exports de diagnostic.
        name: Identifiant utilisateur (AID)
      enabled:
        description: Envoie facultativement les mesures vers la carte mondiale publique
          GMCMap. Désactivé par défaut.
        name: Activer les envois publics
      privacy_confirmed:
        description: Doit être activé avant tout envoi. L’emplacement et les informations
          de station sont gérés dans le compte GMCMap et peuvent être publics.
        name: Confirmer le transfert public des données
      timeout:
        description: Attente maximale par requête GMCMap en secondes. Les échecs sont
          réessayés en arrière-plan avec temporisation progressive.
        name: Délai d’attente réseau
      upload_interval:
        description: Secondes entre les envois publics pour chaque appareil. Un intervalle
          d’au moins 120 à 300 secondes est recommandé.
        name: Intervalle d’envoi
    name: GMCMap (partagé)
  history:
    description: Conservation locale, fuseau des rapports et restauration communs.
    fields:
      enable_purge_all_history:
        description: Affiche la carte de danger permettant de supprimer toutes les données GMC et active l’action côté serveur. Désactivé par défaut pour la sécurité.
        name: Autoriser la suppression complète
      enable_restore:
        description: Autorise temporairement l’import SQLite. Désactivé par défaut
          pour la sécurité.
        name: Autoriser la restauration
      report_timezone:
        description: Fuseau IANA pour les limites journalières et les horodatages,
          par exemple Europe/Paris.
        name: Fuseau horaire des rapports
      retention_days:
        description: Nombre de jours de conservation des mesures dans SQLite.
        name: Conservation de l’historique
    name: Historique et sauvegarde
  interface:
    description: Langue, mode d’affichage et présentation MQTT communs.
    fields:
      publish_advanced_sensors:
        description: Publie les statistiques, la référence et les alertes via MQTT
          Discovery.
        name: Publier les capteurs MQTT avancés
      ui_language:
        description: Auto suit la langue du navigateur.
        name: Langue de l’interface
      ui_mode:
        description: Simple affiche l’essentiel; Avancé ajoute analyses, maintenance
          et exports.
        name: Vue des rapports
    name: Interface
  safety:
    description: Profil de seuils absolus et niveaux d’alerte personnalisés communs.
    fields:
      danger_cpm:
        description: Début de la zone rouge. Doit dépasser le seuil d’avertissement.
        name: Danger CPM personnalisé
      danger_usvh:
        description: Début de la zone rouge pour le débit dérivé.
        name: Danger µSv/h personnalisé
      profile:
        description: GQ utilise les bandes du fabricant. Les références BfS et ICRP
          convertissent mathématiquement 1 et 20 mSv/an en débit continu; ce ne sont
          pas des seuils instantanés officiels. Personnalisé utilise les champs ci-dessous.
        name: Profil de seuils
      threshold_basis:
        description: Utilise les CPM, le débit dérivé ou le résultat le plus strict.
          Actif uniquement avec Personnalisé.
        name: Évaluation du profil personnalisé
      warning_cpm:
        description: Début de la zone jaune. Actif uniquement avec Personnalisé.
        name: Avertissement CPM personnalisé
      warning_usvh:
        description: Début de la zone jaune pour le débit dérivé.
        name: Avertissement µSv/h personnalisé
    name: Évaluation de sécurité
  system:
    description: Paramètres techniques communs à l’ensemble du module.
    fields:
      log_level:
        description: Niveau de détail des journaux du module.
        name: Niveau de journalisation
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB
          controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: Système
'{count} measurements and {events} events were removed.': '{count} measurements and
  {events} events were removed.'
