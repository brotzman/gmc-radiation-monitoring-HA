configuration:
  analysis:
    description: Zajedničke postavke osnovne razine, semafora i događaja za sve uređaje.
    fields:
      baseline_learning_days:
        description: Broj dana povijesti koji se koristi za lokalnu osnovnu vrijednost pozadine.
        name: Razdoblje učenja osnovne vrijednosti
      external_temperature_entity:
        description: Home Assistant sensor used for CPM–temperature correlation when the GMC has no internal temperature sensor. The entity ID remains editable.
        name: External temperature entity
      external_temperature_max_age_seconds:
        description: Older Home Assistant temperature states are not used for correlation.
        name: Maximum external temperature age
      external_temperature_name:
        description: Friendly-name fallback used to locate the temperature sensor when the configured entity ID differs or was renamed.
        name: External temperature search name
      cosmic_hint_enabled:
        description: Uči oprezan pozadinski potpis povezan s tlakom. To je samo statistička naznaka i ne potiskuje upozorenja.
        name: Statistička naznaka kozmičkog utjecaja
      pressure_weather_entity_primary:
        description: Primarni Home Assistant vremenski entitet za trenutačni tlak.
        name: Primarni vremenski entitet tlaka
      pressure_weather_entity_secondary:
        description: Neobavezni drugi entitet za provjeru vjerodostojnosti tlaka.
        name: Sekundarni vremenski entitet tlaka
      pressure_weather_source_name:
        description: Naziv davatelja prikazan uz izvor tlaka.
        name: Davatelj izvora tlaka
      pressure_weather_max_age_seconds:
        description: Starije vrijednosti tlaka isključuju se iz učenja.
        name: Najveća starost vrijednosti tlaka
      pressure_weather_max_difference_hpa:
        description: Najveća dopuštena razlika između dvaju izvora tlaka.
        name: Najveća razlika izvora tlaka
      rapid_rise_percent:
        description: Postotno povećanje koje stvara događaj unutar odabranog vremenskog prozora.
        name: Prag brzog porasta
      rapid_rise_window_minutes:
        description: Razdoblje usporedbe u minutama.
        name: Prozor brzog porasta
      smart_alerts_enabled:
        description: Otkrivaj brze poraste, trajno povišenje i povratak u normalu.
        name: Pametni događaji
      sustained_alert_minutes:
        description: Broj minuta iznad naučene osnovne vrijednosti prije stvaranja trajnog događaja.
        name: Trajno povišenje
      traffic_light_red_percent:
        description: Crveni prag odstupanja; mora biti viši od žutog. Nije sigurnosni prag.
        name: 'Relativni semafor: crveno'
      traffic_light_yellow_percent:
        description: Postotno odstupanje 1-satnog prosjeka od naučene osnovne vrijednosti. Nije sigurnosni prag.
        name: 'Relativni semafor: žuto'
    name: Analiza pozadine
  devices:
    description: Svaki povezani GMC brojač konfigurira se zasebno. Dodajte jedan unos za svaki fizički uređaj.
    fields:
      auxiliary_read_interval:
        description: Seconds between temperature, voltage, dual-tube, device-time and gyro reads. CPM still uses the measurement interval; 0 reads auxiliary values every cycle.
        name: Auxiliary read interval
      command_timeout:
        description: Najdulje čekanje odgovora u sekundama.
        name: Istek odgovora
      cpm_per_usvh:
        description: Faktor pretvorbe specifičan za cijev.
        name: CPM po µSv/h
      device_clock_warning_seconds:
        description: Dopušteno odstupanje u sekundama.
        name: Prag upozorenja sata
      gmcmap_counter_id:
        description: Zaseban javni GMCMap ID za ovaj uređaj.
        name: ID brojača GMCMap
      heartbeat_enabled:
        description: Omogući CPS uživo ako je podržan.
        name: Omogući heartbeat od 1 Hz
      inter_command_delay_ms:
        description: Pauza između naredbi u milisekundama.
        name: Razmak naredbi
      name:
        description: Jedinstveni naziv u Home Assistantu i nadzornoj ploči.
        name: Naziv za prikaz
      read_device_time:
        description: Čitaj sat GMC-a ako je podržan.
        name: Čitaj sat uređaja
      read_gyro:
        description: Zatraži neobavezne podatke žiroskopa.
        name: Čitaj žiroskop
      scan_interval:
        description: Sekunde između spremljenih mjerenja.
        name: Interval mjerenja
      serial_debug:
        description: Log bounded TX/RX hexadecimal and ASCII previews for this device. Enable only while diagnosing.
        name: Serial frame debug
      serial_debug_max_bytes:
        description: Maximum number of bytes shown for each TX/RX frame.
        name: Debug frame byte limit
      serial_startup_delay:
        description: Odgoda pokretanja u sekundama prije inicijalizacije uređaja. Veće konfigurirane vrijednosti ostaju, a uzastopni uređaji uvijek su razmaknuti najmanje 15 sekundi.
        name: Serial startup delay
      orientation_calibration_enabled:
        name: Orientation calibration
        description: Use the configured offsets and scales for roll, pitch and inclination.
      orientation_calibration_serial:
        name: Calibration device serial
        description: Serial number to which this calibration belongs.
      orientation_offset_x:
        name: Orientation X offset
        description: Raw X-axis zero offset from the six-position calibration.
      orientation_offset_y:
        name: Orientation Y offset
        description: Raw Y-axis zero offset from the six-position calibration.
      orientation_offset_z:
        name: Orientation Z offset
        description: Raw Z-axis zero offset from the six-position calibration.
      orientation_scale_x:
        name: Orientation X scale
        description: Raw X-axis counts corresponding to 1 g.
      orientation_scale_y:
        name: Orientation Y scale
        description: Raw Y-axis counts corresponding to 1 g.
      orientation_scale_z:
        name: Orientation Z scale
        description: Raw Z-axis counts corresponding to 1 g.
      orientation_calibration_name:
        name: Calibration profile name
        description: Name shown with the calculated orientation values.
    name: Uređaji
  gmcmap:
    description: Zajednički račun i mrežne postavke za javno slanje. ID brojača ostaje vezan uz pojedini uređaj.
    fields:
      account_id:
        description: Korisnički ID registriranog GMCMap računa. Ne zapisuje se u dnevnike ni dijagnostičke izvoze.
        name: Korisnički ID (AID)
      enabled:
        description: Po želji šalje mjerenja na javnu svjetsku kartu GMCMap. Zadano je onemogućeno.
        name: Omogući javno slanje
      privacy_confirmed:
        description: Mora biti omogućeno prije slanja. Lokacija i podaci postaje uređuju se u GMCMap računu i mogu biti javno vidljivi.
        name: Potvrdi javni prijenos podataka
      timeout:
        description: Najdulje čekanje po GMCMap zahtjevu u sekundama. Pogreške se ponovno pokušavaju u pozadini s postupnim odmakom.
        name: Mrežno vremensko ograničenje
      upload_interval:
        description: Sekunde između javnih slanja za svaki uređaj. Preporučuje se najmanje 120 do 300 sekundi.
        name: Interval slanja
    name: GMCMap (zajedničko)
  history:
    description: Lokalno zadržavanje, vremenska zona izvještaja i zaštićeno upravljanje poviješću.
    fields:
      history_management_enabled:
        description: Omogućuje zaštićene alate za vraćanje i potpuno brisanje povijesti. Tijekom normalnog rada ostavite isključeno.
        name: Upravljanje poviješću
      report_timezone:
        description: IANA vremenska zona za granice dana i vremenske oznake, npr. Europe/Zagreb.
        name: Vremenska zona izvješća
      retention_days:
        description: Broj dana tijekom kojih mjerenja ostaju u lokalnoj SQLite bazi.
        name: Čuvanje povijesti
    name: Povijest i sigurnosna kopija
  interface:
    description: Zajednički jezik, način prikaza i MQTT prezentacija.
    fields:
      publish_advanced_sensors:
        description: Izloži statistiku, osnovnu vrijednost i upozorenja putem MQTT Discoveryja.
        name: Objavi napredne MQTT senzore
      ui_language:
        description: Automatski način slijedi jezik preglednika.
        name: Jezik sučelja
      ui_mode:
        description: Jednostavni prikaz pokazuje osnovne vrijednosti; napredni dodaje analizu, održavanje i izvoz.
        name: Prikaz izvješća
    name: Sučelje
  safety:
    description: Zajednički profil apsolutnih pragova i prilagođene razine upozorenja.
    fields:
      danger_cpm:
        description: Početak crvene razine. Mora biti iznad praga upozorenja.
        name: Prilagođeni CPM opasnosti
      danger_usvh:
        description: Početak crvene razine za izvedenu brzinu doze.
        name: Prilagođena opasnost u µSv/h
      profile:
        description: GQ koristi raspone proizvođača. BfS i ICRP reference matematički pretvaraju 1 i 20 mSv/godinu u kontinuiranu brzinu; nisu službeni trenutačni pragovi alarma. Prilagođeni profil koristi polja u nastavku.
        name: Profil pragova
      threshold_basis:
        description: Upotrijebi CPM, izvedenu brzinu doze ili stroži rezultat. Primjenjuje se samo na prilagođeni profil.
        name: Procjena prilagođenog profila
      warning_cpm:
        description: Početak žute razine. Primjenjuje se samo na prilagođeni profil.
        name: Prilagođeni CPM upozorenja
      warning_usvh:
        description: Početak žute razine za izvedenu brzinu doze.
        name: Prilagođeno upozorenje u µSv/h
    name: Sigurnosna procjena
  system:
    description: Zajedničke tehničke postavke cijelog dodatka.
    fields:
      log_level:
        description: Razina pojedinosti u zapisnicima dodatka.
        name: Razina zapisivanja
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: Sustav
