configuration:
  analysis:
    description: Impostazioni comuni di riferimento, semaforo ed eventi per tutti
      i dispositivi.
    fields:
      baseline_learning_days:
        description: Giorni di cronologia usati per il fondo locale.
        name: Periodo apprendimento baseline
      external_temperature_entity:
        description: Home Assistant sensor used for CPM–temperature correlation when
          the GMC has no internal temperature sensor. The entity ID remains editable.
        name: External temperature entity
      external_temperature_max_age_seconds:
        description: Older Home Assistant temperature states are not used for correlation.
        name: Maximum external temperature age
      external_temperature_name:
        description: Friendly-name fallback used to locate the temperature sensor
          when the configured entity ID differs or was renamed.
        name: External temperature search name
      cosmic_hint_enabled:
        description: Apprende una prudente firma di fondo legata alla pressione. È
          solo un’indicazione statistica e non sopprime gli avvisi.
        name: Indicazione statistica dell’influenza cosmica
      pressure_weather_entity_primary:
        description: Entità meteo Home Assistant principale per la pressione attuale.
        name: Entità meteo pressione primaria
      pressure_weather_entity_secondary:
        description: Seconda entità meteo opzionale per verificare la plausibilità
          della pressione.
        name: Entità meteo pressione secondaria
      pressure_weather_source_name:
        description: Nome del fornitore mostrato con la fonte della pressione.
        name: Fornitore della fonte di pressione
      pressure_weather_max_age_seconds:
        description: I valori di pressione più vecchi vengono esclusi dall’apprendimento.
        name: Età massima della pressione
      pressure_weather_max_difference_hpa:
        description: Differenza massima consentita tra le due fonti di pressione.
        name: Differenza massima delle fonti di pressione
      rapid_rise_percent:
        description: Aumento percentuale che genera un evento nella finestra scelta.
        name: Soglia aumento rapido
      rapid_rise_window_minutes:
        description: Periodo di confronto in minuti.
        name: Finestra aumento rapido
      smart_alerts_enabled:
        description: Rileva aumenti rapidi, livelli elevati persistenti e ritorno
          alla normalità.
        name: Eventi intelligenti
      sustained_alert_minutes:
        description: Minuti sopra la baseline appresa prima di un evento persistente.
        name: Aumento persistente
      traffic_light_red_percent:
        description: Soglia rossa di scostamento; deve superare quella gialla. Non
          è un limite di sicurezza.
        name: 'Semaforo relativo: rosso'
      traffic_light_yellow_percent:
        description: Scostamento percentuale della media oraria dalla baseline appresa.
          Non è un limite di sicurezza.
        name: 'Semaforo relativo: giallo'
    name: Analisi del fondo
  devices:
    description: Configura ogni contatore GMC collegato in modo indipendente. Aggiungi
      una voce per ogni dispositivo fisico.
    fields:
      auxiliary_read_interval:
        description: Seconds between temperature, voltage, dual-tube, device-time
          and gyro reads. CPM still uses the measurement interval; 0 reads auxiliary
          values every cycle.
        name: Auxiliary read interval
      command_timeout:
        description: Attesa massima della risposta in secondi.
        name: Timeout risposta
      cpm_per_usvh:
        description: Fattore di conversione specifico del tubo.
        name: CPM per µSv/h
      device_clock_warning_seconds:
        description: Scostamento consentito in secondi.
        name: Soglia avviso orologio
      gmcmap_counter_id:
        description: ID pubblico GMCMap dedicato a questo dispositivo.
        name: ID contatore GMCMap
      heartbeat_enabled:
        description: Abilita CPS in tempo reale se supportato.
        name: Abilita heartbeat 1 Hz
      inter_command_delay_ms:
        description: Pausa tra i comandi in millisecondi.
        name: Intervallo tra comandi
      name:
        description: Nome univoco per Home Assistant e il dashboard.
        name: Nome visualizzato
      read_device_time:
        description: Leggi l’orologio del GMC se supportato.
        name: Leggi orologio dispositivo
      read_gyro:
        description: Richiedi i dati opzionali del giroscopio.
        name: Leggi giroscopio
      scan_interval:
        description: Secondi tra le misure memorizzate.
        name: Intervallo di misura
      serial_debug:
        description: Log bounded TX/RX hexadecimal and ASCII previews for this device.
          Enable only while diagnosing.
        name: Serial frame debug
      serial_debug_max_bytes:
        description: Maximum number of bytes shown for each TX/RX frame.
        name: Debug frame byte limit
      serial_startup_delay:
        description: Ritardo di avvio in secondi prima dell’inizializzazione del dispositivo.
          I valori configurati maggiori vengono mantenuti e tra dispositivi consecutivi
          trascorrono sempre almeno 15 secondi.
        name: Serial startup delay
      orientation_calibration_enabled:
        name: Orientation calibration
        description: Use the configured offsets and scales for roll, pitch and inclination.
      orientation_calibration_serial:
        name: Calibration device serial
        description: Serial number to which this calibration belongs.
      orientation_offset_x:
        name: Orientation X offset
        description: Raw X-axis zero offset from the six-position calibration.
      orientation_offset_y:
        name: Orientation Y offset
        description: Raw Y-axis zero offset from the six-position calibration.
      orientation_offset_z:
        name: Orientation Z offset
        description: Raw Z-axis zero offset from the six-position calibration.
      orientation_scale_x:
        name: Orientation X scale
        description: Raw X-axis counts corresponding to 1 g.
      orientation_scale_y:
        name: Orientation Y scale
        description: Raw Y-axis counts corresponding to 1 g.
      orientation_scale_z:
        name: Orientation Z scale
        description: Raw Z-axis counts corresponding to 1 g.
      orientation_calibration_name:
        name: Calibration profile name
        description: Name shown with the calculated orientation values.
    name: Dispositivi
  gmcmap:
    description: Account e impostazioni di rete comuni per gli invii pubblici. L’ID
      contatore resta specifico del dispositivo.
    fields:
      account_id:
        description: ID utente dell’account GMCMap registrato. Non viene registrato
          né salvato nelle esportazioni diagnostiche.
        name: ID utente (AID)
      enabled:
        description: Invia facoltativamente le misurazioni alla mappa mondiale pubblica
          GMCMap. Disattivato per impostazione predefinita.
        name: Abilita invii pubblici
      privacy_confirmed:
        description: Deve essere attivato prima dell’invio. Posizione e dati della
          stazione sono gestiti nell’account GMCMap e possono essere pubblici.
        name: Conferma trasferimento pubblico dei dati
      timeout:
        description: Attesa massima per richiesta GMCMap in secondi. Gli errori vengono
          ritentati in background con attesa progressiva.
        name: Timeout di rete
      upload_interval:
        description: Secondi tra gli invii pubblici per ogni dispositivo. Sono consigliati
          almeno 120–300 secondi.
        name: Intervallo di invio
    name: GMCMap (condiviso)
  history:
    description: Conservazione locale, fuso orario dei report e ripristino condivisi.
    fields:
      enable_purge_all_history:
        description: Mostra la scheda di pericolo per eliminare tutti i dati GMC e abilita l’azione lato server. Disattivata per impostazione predefinita per sicurezza.
        name: Consenti eliminazione completa
      enable_restore:
        description: Consente temporaneamente l’importazione SQLite. Disattivato per
          impostazione predefinita.
        name: Consenti ripristino
      report_timezone:
        description: Fuso IANA per limiti giornalieri e timestamp, ad esempio Europe/Rome.
        name: Fuso orario dei report
      retention_days:
        description: Giorni di conservazione delle misure in SQLite.
        name: Conservazione cronologia
    name: Cronologia e backup
  interface:
    description: Lingua, modalità di visualizzazione e presentazione MQTT condivise.
    fields:
      publish_advanced_sensors:
        description: Pubblica statistiche, baseline e avvisi tramite MQTT Discovery.
        name: Pubblica sensori MQTT avanzati
      ui_language:
        description: Auto segue la lingua del browser.
        name: Lingua interfaccia
      ui_mode:
        description: Semplice mostra i valori principali; Avanzata aggiunge analisi,
          manutenzione ed esportazioni.
        name: Vista report
    name: Interfaccia
  safety:
    description: Profilo soglie assolute e livelli di avviso personalizzati condivisi.
    fields:
      danger_cpm:
        description: Inizio della zona rossa. Deve superare la soglia di avviso.
        name: Pericolo CPM personalizzato
      danger_usvh:
        description: Inizio della zona rossa per il rateo derivato.
        name: Pericolo µSv/h personalizzato
      profile:
        description: GQ usa le fasce del produttore. I riferimenti BfS e ICRP convertono
          matematicamente 1 e 20 mSv/anno in un rateo continuo; non sono soglie ufficiali
          istantanee. Personalizzato usa i campi seguenti.
        name: Profilo soglie
      threshold_basis:
        description: Usa CPM, rateo derivato o il risultato più restrittivo. Attivo
          solo con Personalizzato.
        name: Valutazione profilo personalizzato
      warning_cpm:
        description: Inizio della zona gialla. Attivo solo con Personalizzato.
        name: Avviso CPM personalizzato
      warning_usvh:
        description: Inizio della zona gialla per il rateo derivato.
        name: Avviso µSv/h personalizzato
    name: Valutazione di sicurezza
  system:
    description: Impostazioni tecniche comuni per l’intero add-on.
    fields:
      log_level:
        description: Livello di dettaglio dei log dell’add-on.
        name: Livello log
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB
          controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: Sistema
'{count} measurements and {events} events were removed.': '{count} measurements and
