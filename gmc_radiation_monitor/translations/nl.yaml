configuration:
  analysis:
    description: Gedeelde basislijn-, verkeerslicht- en gebeurtenisinstellingen voor
      alle apparaten.
    fields:
      baseline_learning_days:
        description: Aantal historische dagen voor de lokale achtergrondbasis.
        name: Leerperiode basislijn
      external_temperature_entity:
        description: Home Assistant sensor used for CPM–temperature correlation when
          the GMC has no internal temperature sensor. The entity ID remains editable.
        name: External temperature entity
      external_temperature_max_age_seconds:
        description: Older Home Assistant temperature states are not used for correlation.
        name: Maximum external temperature age
      external_temperature_name:
        description: Friendly-name fallback used to locate the temperature sensor
          when the configured entity ID differs or was renamed.
        name: External temperature search name
      cosmic_hint_enabled:
        description: Leert een voorzichtige luchtdrukgerelateerde achtergrondsignatuur.
          Alleen een statistische aanwijzing; waarschuwingen blijven actief.
        name: Statistische aanwijzing voor kosmische invloed
      pressure_weather_entity_primary:
        description: Primaire Home Assistant-weerentiteit voor de actuele luchtdruk.
        name: Primaire luchtdruk-weerentiteit
      pressure_weather_entity_secondary:
        description: Optionele tweede weerentiteit voor plausibiliteitscontrole.
        name: Secundaire luchtdruk-weerentiteit
      pressure_weather_source_name:
        description: Naam van de aanbieder die bij de drukbron wordt getoond.
        name: Aanbieder van de drukbron
      pressure_weather_max_age_seconds:
        description: Oudere drukwaarden worden niet voor het model gebruikt.
        name: Maximale leeftijd van de drukwaarde
      pressure_weather_max_difference_hpa:
        description: Maximaal toegestaan verschil tussen beide drukbronnen.
        name: Maximaal verschil tussen drukbronnen
      rapid_rise_percent:
        description: Procentuele stijging die binnen het gekozen venster een gebeurtenis
          maakt.
        name: Drempel snelle stijging
      rapid_rise_window_minutes:
        description: Vergelijkingsperiode in minuten.
        name: Venster snelle stijging
      smart_alerts_enabled:
        description: Detecteert snelle stijgingen, langdurige verhoging en terugkeer
          naar normaal.
        name: Slimme gebeurtenissen
      sustained_alert_minutes:
        description: Minuten boven de geleerde basislijn vóór een aanhoudende gebeurtenis.
        name: Aanhoudende verhoging
      traffic_light_red_percent:
        description: Rode afwijkingsdrempel; moet hoger zijn dan geel. Geen veiligheidsgrens.
        name: 'Relatieve lamp: rood'
      traffic_light_yellow_percent:
        description: Procentuele afwijking van het uurgemiddelde ten opzichte van
          de geleerde basislijn. Geen veiligheidsgrens.
        name: 'Relatieve lamp: geel'
    name: Achtergrondanalyse
  devices:
    description: Configureer elke aangesloten GMC-teller afzonderlijk. Voeg één item
      per fysiek apparaat toe.
    fields:
      auxiliary_read_interval:
        description: Seconds between temperature, voltage, dual-tube, device-time
          and gyro reads. CPM still uses the measurement interval; 0 reads auxiliary
          values every cycle.
        name: Auxiliary read interval
      command_timeout:
        description: Maximale wachttijd in seconden.
        name: Antwoordtime-out
      cpm_per_usvh:
        description: Buisspecifieke omrekenfactor.
        name: CPM per µSv/h
      device_clock_warning_seconds:
        description: Toegestane afwijking in seconden.
        name: Waarschuwingsdrempel klok
      gmcmap_counter_id:
        description: Eigen openbare GMCMap-ID voor dit apparaat.
        name: GMCMap-teller-ID
      heartbeat_enabled:
        description: Schakel live CPS in indien ondersteund.
        name: 1 Hz-heartbeat inschakelen
      inter_command_delay_ms:
        description: Pauze in milliseconden.
        name: Pauze tussen opdrachten
      name:
        description: Unieke naam voor Home Assistant en het dashboard.
        name: Weergavenaam
      read_device_time:
        description: Lees de GMC-klok indien ondersteund.
        name: Apparaatklok uitlezen
      read_gyro:
        description: Vraag optionele gyroscoopgegevens op.
        name: Gyroscoop uitlezen
      scan_interval:
        description: Seconden tussen opgeslagen metingen.
        name: Meetinterval
      serial_debug:
        description: Log bounded TX/RX hexadecimal and ASCII previews for this device.
          Enable only while diagnosing.
        name: Serial frame debug
      serial_debug_max_bytes:
        description: Maximum number of bytes shown for each TX/RX frame.
        name: Debug frame byte limit
      serial_startup_delay:
        description: Startverschuiving in seconden voordat dit apparaat wordt geïnitialiseerd.
          Grotere ingestelde waarden blijven behouden en opeenvolgende apparaten worden
          altijd met minimaal 15 seconden gestart.
        name: Serial startup delay
      orientation_calibration_enabled:
        name: Orientation calibration
        description: Use the configured offsets and scales for roll, pitch and inclination.
      orientation_calibration_serial:
        name: Calibration device serial
        description: Serial number to which this calibration belongs.
      orientation_offset_x:
        name: Orientation X offset
        description: Raw X-axis zero offset from the six-position calibration.
      orientation_offset_y:
        name: Orientation Y offset
        description: Raw Y-axis zero offset from the six-position calibration.
      orientation_offset_z:
        name: Orientation Z offset
        description: Raw Z-axis zero offset from the six-position calibration.
      orientation_scale_x:
        name: Orientation X scale
        description: Raw X-axis counts corresponding to 1 g.
      orientation_scale_y:
        name: Orientation Y scale
        description: Raw Y-axis counts corresponding to 1 g.
      orientation_scale_z:
        name: Orientation Z scale
        description: Raw Z-axis counts corresponding to 1 g.
      orientation_calibration_name:
        name: Calibration profile name
        description: Name shown with the calculated orientation values.
    name: Apparaten
  gmcmap:
    description: Gedeelde account- en netwerkinstellingen voor openbare uploads. De
      teller-ID blijft apparaatspecifiek.
    fields:
      account_id:
        description: GMCMap-gebruikers-ID van het geregistreerde account. Deze wordt
          niet gelogd of in diagnose-exporten opgeslagen.
        name: Gebruikers-ID (AID)
      enabled:
        description: Stuur metingen optioneel naar de openbare GMCMap-wereldkaart.
          Standaard uitgeschakeld.
        name: Openbare uploads inschakelen
      privacy_confirmed:
        description: Moet zijn ingeschakeld voordat gegevens worden verzonden. Locatie-
          en stationsgegevens worden in het GMCMap-account beheerd en kunnen openbaar
          zichtbaar zijn.
        name: Openbare gegevensoverdracht bevestigen
      timeout:
        description: Maximale wachttijd per GMCMap-verzoek in seconden. Fouten worden
          op de achtergrond met oplopende wachttijd opnieuw geprobeerd.
        name: Netwerktime-out
      upload_interval:
        description: Seconden tussen openbare uploads per apparaat. Minimaal 120 tot
          300 seconden wordt aanbevolen.
        name: Uploadinterval
    name: GMCMap (gedeeld)
  history:
    description: Gedeelde lokale bewaartermijn, rapporttijdzone en herstelinstellingen.
    fields:
      enable_purge_all_history:
        description: Toont de gevarenkaart voor het verwijderen van alle GMC-gegevens en schakelt de serveractie in. Om veiligheidsredenen standaard uitgeschakeld.
        name: Volledig verwijderen toestaan
      enable_restore:
        description: Staat tijdelijk SQLite-import toe. Om veiligheidsredenen standaard
          uitgeschakeld.
        name: Herstel toestaan
      report_timezone:
        description: IANA-tijdzone voor daggrenzen en tijdstempels, bijvoorbeeld Europe/Amsterdam.
        name: Tijdzone rapporten
      retention_days:
        description: Aantal dagen dat metingen in SQLite worden bewaard.
        name: Bewaartermijn geschiedenis
    name: Geschiedenis en back-up
  interface:
    description: Gedeelde taal, weergavemodus en MQTT-presentatie.
    fields:
      publish_advanced_sensors:
        description: Publiceert statistieken, basislijn en alarmwaarden via MQTT Discovery.
        name: Geavanceerde MQTT-sensoren publiceren
      ui_language:
        description: Auto volgt de browsertaal.
        name: Interfacetaal
      ui_mode:
        description: Eenvoudig toont kernwaarden; Geavanceerd voegt analyse, onderhoud
          en exports toe.
        name: Rapportweergave
    name: Interface
  safety:
    description: Gedeeld absoluut drempelprofiel en aangepaste waarschuwingsniveaus.
    fields:
      danger_cpm:
        description: Begin van rood. Moet hoger zijn dan de waarschuwingsdrempel.
        name: Aangepast gevaar CPM
      danger_usvh:
        description: Begin van rood voor het afgeleide dosistempo.
        name: Aangepast gevaar µSv/h
      profile:
        description: GQ gebruikt fabrikantbanden. BfS- en ICRP-referenties rekenen
          1 en 20 mSv/jaar wiskundig om naar een continu dosistempo; dit zijn geen
          officiële directe alarmgrenzen. Aangepast gebruikt de velden hieronder.
        name: Drempelprofiel
      threshold_basis:
        description: Gebruikt CPM, afgeleid dosistempo of het strengste resultaat.
          Alleen actief bij Aangepast.
        name: Evaluatie aangepast profiel
      warning_cpm:
        description: Begin van geel. Alleen actief bij Aangepast.
        name: Aangepaste waarschuwing CPM
      warning_usvh:
        description: Begin van geel voor het afgeleide dosistempo.
        name: Aangepaste waarschuwing µSv/h
    name: Veiligheidsbeoordeling
  system:
    description: Gedeelde technische instellingen voor de volledige add-on.
    fields:
      log_level:
        description: Detailniveau van de add-onlogboeken.
        name: Logniveau
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB
          controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: Systeem
'{count} measurements and {events} events were removed.': '{count} measurements and
  {events} events were removed.'
