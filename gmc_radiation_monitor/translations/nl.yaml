All GMC history was deleted: De hele GMC-geschiedenis is verwijderd
Another report or maintenance job is running: Er wordt nog een rapport of onderhoudstaak uitgevoerd
Complete history deletion failed: Het volledig verwijderen van de geschiedenis is mislukt
Danger zone: Gevarenzone
Delete all GMC history: Verwijder de hele GMC geschiedenis
Deletion confirmation text must be exactly DELETE ALL GMC HISTORY: De bevestigingstekst voor verwijderen moet 
  exact DELETE ALL GMC HISTORY zijn
History deleted: Geschiedenis verwijderd
Invalid deletion confirmation: Ongeldige verwijderingsbevestiging
? Permanently delete all GMC history from this app and Home Assistant Recorder. This includes CPM, 
  temperature, voltage, gyro and tube measurements for every known GMC and all time periods.
: Verwijder permanent alle GMC-geschiedenis van deze app en Home Assistant Recorder. Dit omvat CPM, 
  temperatuur-, spannings-, gyro- en buismetingen voor elke bekende GMC en alle tijdsperioden.
This cannot be undone. Delete all GMC history?: Dit kan niet ongedaan worden gemaakt. De hele GMC geschiedenis
  verwijderen?
Type DELETE ALL GMC HISTORY to confirm: Typ DELETE ALL GMC HISTORY om te bevestigen
configuration:
  analysis:
    description: Gedeelde basislijn-, verkeerslicht- en gebeurtenisinstellingen voor alle apparaten.
    fields:
      baseline_learning_days:
        description: Aantal historische dagen voor de lokale achtergrondbasis.
        name: Leerperiode basislijn
      external_temperature_entity:
        description: Home Assistant-sensor voor de correlatie tussen CPM en temperatuur wanneer de GMC geen 
          interne temperatuursensor heeft. De entiteits-ID blijft bewerkbaar.
        name: Entiteit voor buitentemperatuur
      external_temperature_max_age_seconds:
        description: Oudere temperatuurstatussen van Home Assistant worden niet voor correlatie gebruikt.
        name: Maximale leeftijd van de buitentemperatuur
      external_temperature_name:
        description: Terugval op een gebruiksvriendelijke naam om de temperatuursensor te vinden wanneer de 
          ingestelde entiteits-ID afwijkt of is hernoemd.
        name: Zoeknaam voor buitentemperatuur
      cosmic_hint_enabled:
        description: Leert een voorzichtige luchtdrukgerelateerde achtergrondsignatuur. Alleen een 
          statistische aanwijzing; waarschuwingen blijven actief.
        name: Statistische aanwijzing voor kosmische invloed
      pressure_weather_entity_primary:
        description: Primaire Home Assistant-weerentiteit voor de actuele luchtdruk.
        name: Primaire luchtdruk-weerentiteit
      pressure_weather_entity_secondary:
        description: Optionele tweede weerentiteit voor plausibiliteitscontrole.
        name: Secundaire luchtdruk-weerentiteit
      pressure_weather_source_name:
        description: Naam van de aanbieder die bij de drukbron wordt getoond.
        name: Aanbieder van de drukbron
      pressure_weather_max_age_seconds:
        description: Oudere drukwaarden worden niet voor het model gebruikt.
        name: Maximale leeftijd van de drukwaarde
      pressure_weather_max_difference_hpa:
        description: Maximaal toegestaan verschil tussen beide drukbronnen.
        name: Maximaal verschil tussen drukbronnen
      rapid_rise_percent:
        description: Procentuele stijging die binnen het gekozen venster een gebeurtenis maakt.
        name: Drempel snelle stijging
      rapid_rise_window_minutes:
        description: Vergelijkingsperiode in minuten.
        name: Venster snelle stijging
      smart_alerts_enabled:
        description: Detecteert snelle stijgingen, langdurige verhoging en terugkeer naar normaal.
        name: Slimme gebeurtenissen
      sustained_alert_minutes:
        description: Minuten boven de geleerde basislijn vóór een aanhoudende gebeurtenis.
        name: Aanhoudende verhoging
      traffic_light_red_percent:
        description: Rode afwijkingsdrempel; moet hoger zijn dan geel. Geen veiligheidsgrens.
        name: 'Relatieve lamp: rood'
      traffic_light_yellow_percent:
        description: Procentuele afwijking van het uurgemiddelde ten opzichte van de geleerde basislijn. Geen 
          veiligheidsgrens.
        name: 'Relatieve lamp: geel'
    name: Achtergrondanalyse
  devices:
    description: Volledige configuratie voor GMC-300, GMC-320, GMC-600/600+ en andere tellers met precies één 
      fysieke buis. Instellingen voor twee buizen worden hier niet getoond.
    fields:
      auxiliary_read_interval:
        description: Seconden tussen metingen van temperatuur, spanning, dubbele buis, apparaattijd en 
          gyroscoop. CPM blijft het meetinterval gebruiken; 0 leest de hulpwaarden bij elke cyclus.
        name: Interval voor hulpmetingen
      command_timeout:
        description: Maximale wachttijd in seconden.
        name: Antwoordtime-out
      cpm_per_usvh:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde in om de voorinstelling 
          voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Conversiefactor'
      device_clock_warning_seconds:
        description: Toegestane afwijking in seconden.
        name: Waarschuwingsdrempel klok
      gmcmap_counter_id:
        description: Eigen openbare GMCMap-ID voor dit apparaat.
        name: GMCMap-teller-ID
      heartbeat_enabled:
        description: Schakel live CPS in indien ondersteund.
        name: 1 Hz-heartbeat inschakelen
      inter_command_delay_ms:
        description: Pauze in milliseconden.
        name: Pauze tussen opdrachten
      name:
        description: Unieke naam voor Home Assistant en het dashboard.
        name: Weergavenaam
      read_device_time:
        description: Lees de GMC-klok indien ondersteund.
        name: Apparaatklok uitlezen
      read_gyro:
        description: Vraag optionele gyroscoopgegevens op.
        name: Gyroscoop uitlezen
      scan_interval:
        description: Seconden tussen opgeslagen metingen.
        name: Meetinterval
      serial_debug:
        description: Log begrensde hexadecimale en ASCII-voorbeelden van TX/RX-frames voor dit apparaat. 
          Alleen inschakelen tijdens diagnose.
        name: Foutopsporing van seriële frames
      serial_debug_max_bytes:
        description: Maximaal aantal bytes dat voor elk TX/RX-frame wordt weergegeven.
        name: Bytegrens voor debugframe
      serial_startup_delay:
        description: Startverschuiving in seconden voordat dit apparaat wordt geïnitialiseerd. Grotere 
          ingestelde waarden blijven behouden en opeenvolgende apparaten worden altijd met minimaal 15 
          seconden gestart.
        name: Opstartvertraging seriële verbinding
      orientation_calibration_enabled:
