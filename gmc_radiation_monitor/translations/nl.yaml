All GMC history was deleted: De hele GMC-geschiedenis is verwijderd
Another report or maintenance job is running: Er wordt nog een rapport of onderhoudstaak
  uitgevoerd
Complete history deletion failed: Het volledig verwijderen van de geschiedenis is
  mislukt
Danger zone: Gevarenzone
Delete all GMC history: Verwijder de hele GMC geschiedenis
Deletion confirmation text must be exactly DELETE ALL GMC HISTORY: De bevestigingstekst
  voor verwijderen moet exact DELETE ALL GMC HISTORY zijn
History deleted: Geschiedenis verwijderd
Invalid deletion confirmation: Ongeldige verwijderingsbevestiging
? Permanently delete all GMC history from this app and Home Assistant Recorder. This
  includes CPM, temperature, voltage, gyro and tube measurements for every known GMC
  and all time periods.
: Verwijder permanent alle GMC-geschiedenis van deze app en Home Assistant Recorder.
  Dit omvat CPM, temperatuur-, spannings-, gyro- en buismetingen voor elke bekende
  GMC en alle tijdsperioden.
This cannot be undone. Delete all GMC history?: Dit kan niet ongedaan worden gemaakt.
  De hele GMC geschiedenis verwijderen?
Type DELETE ALL GMC HISTORY to confirm: Typ DELETE ALL GMC HISTORY om te bevestigen
configuration:
  analysis:
    description: Gedeelde basislijn-, verkeerslicht- en gebeurtenisinstellingen voor
      alle apparaten.
    fields:
      baseline_learning_days:
        description: Aantal historische dagen voor de lokale achtergrondbasis.
        name: Leerperiode basislijn
      external_temperature_entity:
        description: Home Assistant-sensor voor de correlatie tussen CPM en temperatuur
          wanneer de GMC geen interne temperatuursensor heeft. De entiteits-ID blijft
          bewerkbaar.
        name: Entiteit voor buitentemperatuur
      external_temperature_max_age_seconds:
        description: Oudere temperatuurstatussen van Home Assistant worden niet voor
          correlatie gebruikt.
        name: Maximale leeftijd van de buitentemperatuur
      external_temperature_name:
        description: Terugval op een gebruiksvriendelijke naam om de temperatuursensor
          te vinden wanneer de ingestelde entiteits-ID afwijkt of is hernoemd.
        name: Zoeknaam voor buitentemperatuur
      cosmic_hint_enabled:
        description: Leert een voorzichtige luchtdrukgerelateerde achtergrondsignatuur.
          Alleen een statistische aanwijzing; waarschuwingen blijven actief.
        name: Statistische aanwijzing voor kosmische invloed
      pressure_weather_entity_primary:
        description: Primaire Home Assistant-weerentiteit voor de actuele luchtdruk.
        name: Primaire luchtdruk-weerentiteit
      pressure_weather_entity_secondary:
        description: Optionele tweede weerentiteit voor plausibiliteitscontrole.
        name: Secundaire luchtdruk-weerentiteit
      pressure_weather_source_name:
        description: Naam van de aanbieder die bij de drukbron wordt getoond.
        name: Aanbieder van de drukbron
      pressure_weather_max_age_seconds:
        description: Oudere drukwaarden worden niet voor het model gebruikt.
        name: Maximale leeftijd van de drukwaarde
      pressure_weather_max_difference_hpa:
        description: Maximaal toegestaan verschil tussen beide drukbronnen.
        name: Maximaal verschil tussen drukbronnen
      rapid_rise_percent:
        description: Procentuele stijging die binnen het gekozen venster een gebeurtenis
          maakt.
        name: Drempel snelle stijging
      rapid_rise_window_minutes:
        description: Vergelijkingsperiode in minuten.
        name: Venster snelle stijging
      smart_alerts_enabled:
        description: Detecteert snelle stijgingen, langdurige verhoging en terugkeer
          naar normaal.
        name: Slimme gebeurtenissen
      sustained_alert_minutes:
        description: Minuten boven de geleerde basislijn vóór een aanhoudende gebeurtenis.
        name: Aanhoudende verhoging
      traffic_light_red_percent:
        description: Rode afwijkingsdrempel; moet hoger zijn dan geel. Geen veiligheidsgrens.
        name: 'Relatieve lamp: rood'
      traffic_light_yellow_percent:
        description: Procentuele afwijking van het uurgemiddelde ten opzichte van
          de geleerde basislijn. Geen veiligheidsgrens.
        name: 'Relatieve lamp: geel'
    name: Achtergrondanalyse
  devices:
    description: Configureer elke aangesloten GMC-teller afzonderlijk. Voeg één item
      per fysiek apparaat toe.
    fields:
      auxiliary_read_interval:
        description: Seconden tussen metingen van temperatuur, spanning, dubbele buis,
          apparaattijd en gyroscoop. CPM blijft het meetinterval gebruiken; 0 leest
          de hulpwaarden bij elke cyclus.
        name: Interval voor hulpmetingen
      command_timeout:
        description: Maximale wachttijd in seconden.
        name: Antwoordtime-out
      cpm_per_usvh:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Conversiefactor'
      device_clock_warning_seconds:
        description: Toegestane afwijking in seconden.
        name: Waarschuwingsdrempel klok
      gmcmap_counter_id:
        description: Eigen openbare GMCMap-ID voor dit apparaat.
        name: GMCMap-teller-ID
      heartbeat_enabled:
        description: Schakel live CPS in indien ondersteund.
        name: 1 Hz-heartbeat inschakelen
      inter_command_delay_ms:
        description: Pauze in milliseconden.
        name: Pauze tussen opdrachten
      name:
        description: Unieke naam voor Home Assistant en het dashboard.
        name: Weergavenaam
      read_device_time:
        description: Lees de GMC-klok indien ondersteund.
        name: Apparaatklok uitlezen
      read_gyro:
        description: Vraag optionele gyroscoopgegevens op.
        name: Gyroscoop uitlezen
      scan_interval:
        description: Seconden tussen opgeslagen metingen.
        name: Meetinterval
      serial_debug:
        description: Log begrensde hexadecimale en ASCII-voorbeelden van TX/RX-frames
          voor dit apparaat. Alleen inschakelen tijdens diagnose.
        name: Foutopsporing van seriële frames
      serial_debug_max_bytes:
        description: Maximaal aantal bytes dat voor elk TX/RX-frame wordt weergegeven.
        name: Bytegrens voor debugframe
      serial_startup_delay:
        description: Startverschuiving in seconden voordat dit apparaat wordt geïnitialiseerd.
          Grotere ingestelde waarden blijven behouden en opeenvolgende apparaten worden
          altijd met minimaal 15 seconden gestart.
        name: Opstartvertraging seriële verbinding
      orientation_calibration_enabled:
        name: Oriëntatiekalibratie
        description: Gebruik de ingestelde offsets en schalen voor rollen, stampen
          en helling.
      orientation_calibration_serial:
        name: Serienummer van kalibratieapparaat
        description: Serienummer waartoe deze kalibratie behoort.
      orientation_offset_x:
        name: X-offset voor oriëntatie
        description: Ruwe nuloffset van de X-as uit de kalibratie met zes posities.
      orientation_offset_y:
        name: Y-offset voor oriëntatie
        description: Ruwe nuloffset van de Y-as uit de kalibratie met zes posities.
      orientation_offset_z:
        name: Z-offset voor oriëntatie
        description: Ruwe nuloffset van de Z-as uit de kalibratie met zes posities.
      orientation_scale_x:
        name: X-schaal voor oriëntatie
        description: Ruwe tellingen van de X-as die overeenkomen met 1 g.
      orientation_scale_y:
        name: Y-schaal voor oriëntatie
        description: Ruwe tellingen van de Y-as die overeenkomen met 1 g.
      orientation_scale_z:
        name: Z-schaal voor oriëntatie
        description: Ruwe tellingen van de Z-as die overeenkomen met 1 g.
      orientation_calibration_name:
        name: Naam van kalibratieprofiel
        description: Naam die bij de berekende oriëntatiewaarden wordt weergegeven.
      dead_time_us:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Dode tijd van detector'
      reliable_max_cpm:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Maximaal betrouwbare CPM'
      dead_time_model:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Dode-tijdmodel'
      conversion_factor_uncertainty_percent:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Onzekerheid conversiefactor'
      calibration_uncertainty_percent:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Kalibratieonzekerheid'
      calibration_reference:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Kalibratiereferentie'
      tube_model:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde
          in om de voorinstelling voor dit apparaat te vervangen.
        name: 'Enige/primaire buis: Buismodel'
      dual_tube_mode:
        name: Buisbedrijfsmodus (geavanceerd)
        description: Normaal ingesteld door het detectorprofiel. Gebruik single voor
          één fysieke buis en separate of curve alleen voor ondersteunde apparaten
          met twee buizen.
      dual_tube_switch_cpm:
        name: Omschakel-CPM van tweede buis
        description: Alleen voor apparaten met twee buizen. De GMC-500+-werkwaarde
          is vooraf ingesteld en mag alleen met een geverifieerde kalibratie worden
          gewijzigd.
      high_dose_tube_model:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Buismodel'
      high_dose_cpm_per_usvh:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Conversiefactor'
      high_dose_dead_time_us:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Dode tijd van detector'
      high_dose_reliable_max_cpm:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Maximaal betrouwbare
          CPM'
      high_dose_dead_time_model:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Dode-tijdmodel'
      high_dose_conversion_factor_uncertainty_percent:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Onzekerheid van conversiefactor'
      high_dose_calibration_uncertainty_percent:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Kalibratieonzekerheid'
      high_dose_calibration_reference:
        description: Alleen voor de tweede/hogedosisbuis van een apparaat met twee
          buizen. Leeg laten voor GMC-320 en andere modellen met één buis.
        name: 'Tweede buis (alleen apparaten met twee buizen): Kalibratiereferentie'
      detector_profile:
        name: Detectorprofiel (voorinstelling)
        description: Detecteert GMC-300, GMC-320, GMC-500+ en GMC-600+ automatisch
          en laadt buismodel, dode tijd, omrekenfactor, waarschuwingsdrempels en kalibratiestatus.
          Kies alleen bewust een andere waarde voor een eigen profiel.
    name: Apparaten
  gmcmap:
    description: Gedeelde account- en netwerkinstellingen voor openbare uploads. De
      teller-ID blijft apparaatspecifiek.
    fields:
      account_id:
        description: GMCMap-gebruikers-ID van het geregistreerde account. Deze wordt
          niet gelogd of in diagnose-exporten opgeslagen.
        name: Gebruikers-ID (AID)
      enabled:
        description: Stuur metingen optioneel naar de openbare GMCMap-wereldkaart.
          Standaard uitgeschakeld.
        name: Openbare uploads inschakelen
      privacy_confirmed:
        description: Moet zijn ingeschakeld voordat gegevens worden verzonden. Locatie-
          en stationsgegevens worden in het GMCMap-account beheerd en kunnen openbaar
          zichtbaar zijn.
        name: Openbare gegevensoverdracht bevestigen
      timeout:
        description: Maximale wachttijd per GMCMap-verzoek in seconden. Fouten worden
          op de achtergrond met oplopende wachttijd opnieuw geprobeerd.
        name: Netwerktime-out
      upload_interval:
        description: Seconden tussen openbare uploads per apparaat. Minimaal 120 tot
          300 seconden wordt aanbevolen.
        name: Uploadinterval
    name: GMCMap (gedeeld)
  history:
    description: Lokale bewaartermijn, rapporttijdzone en beveiligd historiebeheer.
    fields:
      history_management_enabled:
        description: Schakelt de beveiligde functies voor herstel en volledige verwijdering
          in. Laat dit tijdens normaal gebruik uitgeschakeld.
        name: Historiebeheer
      report_timezone:
        description: IANA-tijdzone voor daggrenzen en tijdstempels, bijvoorbeeld Europe/Amsterdam.
        name: Tijdzone rapporten
      retention_days:
        description: Aantal dagen dat metingen in SQLite worden bewaard.
        name: Bewaartermijn geschiedenis
    name: Geschiedenis en back-up
  interface:
    description: Gedeelde taal, weergavemodus en MQTT-presentatie.
    fields:
      publish_advanced_sensors:
        description: Publiceert statistieken, basislijn en alarmwaarden via MQTT Discovery.
        name: Geavanceerde MQTT-sensoren publiceren
      ui_language:
        description: Auto volgt de browsertaal.
        name: Interfacetaal
      ui_mode:
        description: Eenvoudig toont kernwaarden; Geavanceerd voegt analyse, onderhoud
          en exports toe.
        name: Rapportweergave
    name: Interface
  safety:
    description: Gedeeld absoluut drempelprofiel en aangepaste waarschuwingsniveaus.
    fields:
      danger_cpm:
        description: Begin van rood. Moet hoger zijn dan de waarschuwingsdrempel.
        name: Aangepast gevaar CPM
      danger_usvh:
        description: Begin van rood voor het afgeleide dosistempo.
        name: Aangepast gevaar µSv/h
      profile:
        description: GQ gebruikt fabrikantbanden. BfS- en ICRP-referenties rekenen
          1 en 20 mSv/jaar wiskundig om naar een continu dosistempo; dit zijn geen
          officiële directe alarmgrenzen. Aangepast gebruikt de velden hieronder.
        name: Drempelprofiel
      threshold_basis:
        description: Gebruikt CPM, afgeleid dosistempo of het strengste resultaat.
          Alleen actief bij Aangepast.
        name: Evaluatie aangepast profiel
      warning_cpm:
        description: Begin van geel. Alleen actief bij Aangepast.
        name: Aangepaste waarschuwing CPM
      warning_usvh:
        description: Begin van geel voor het afgeleide dosistempo.
        name: Aangepaste waarschuwing µSv/h
    name: Veiligheidsbeoordeling
  system:
    description: Gedeelde technische instellingen voor de volledige add-on.
    fields:
      log_level:
        description: Detailniveau van de add-onlogboeken.
        name: Logniveau
      serial_scheduler_enabled:
        description: Serialiseer opdrachtvensters voor tellers die de USB-controller
          van de host delen.
        name: Gedeelde seriële planner
      serial_scheduler_gap_seconds:
        description: Rusttijd in seconden tussen opdrachtvensters van verschillende
          tellers.
        name: Rustpauze van planner
    name: Systeem
'{count} measurements and {events} events were removed.': '{count} metingen en {events}
  gebeurtenissen zijn verwijderd.'
? All downloads below automatically use the GMC device currently shown in Analysis.
  Select another connected device above to change the report source.
: Alle onderstaande downloads gebruiken automatisch het GMC-apparaat dat momenteel
  in de analyse wordt weergegeven. Selecteer hierboven een ander verbonden apparaat
  om de rapportbron te wijzigen.
No connected GMC device: Geen verbonden GMC-apparaat
Reports for the displayed analysis: Rapporten voor de weergegeven analyse
