  gmcmap:
    description: Gedeelde account- en netwerkinstellingen voor openbare uploads. De teller-ID blijft 
      apparaatspecifiek.
    fields:
      account_id:
        description: GMCMap-gebruikers-ID van het geregistreerde account. Deze wordt niet gelogd of in 
          diagnose-exporten opgeslagen.
        name: Gebruikers-ID (AID)
      enabled:
        description: Stuur metingen optioneel naar de openbare GMCMap-wereldkaart. Standaard uitgeschakeld.
        name: Openbare uploads inschakelen
      privacy_confirmed:
        description: Moet zijn ingeschakeld voordat gegevens worden verzonden. Locatie- en stationsgegevens 
          worden in het GMCMap-account beheerd en kunnen openbaar zichtbaar zijn.
        name: Openbare gegevensoverdracht bevestigen
      timeout:
        description: Maximale wachttijd per GMCMap-verzoek in seconden. Fouten worden op de achtergrond met 
          oplopende wachttijd opnieuw geprobeerd.
        name: Netwerktime-out
      upload_interval:
        description: Seconden tussen openbare uploads per apparaat. Minimaal 120 tot 300 seconden wordt 
          aanbevolen.
        name: Uploadinterval
    name: GMCMap (gedeeld)
  history:
    description: Lokale bewaartermijn, rapporttijdzone en beveiligd historiebeheer.
    fields:
      history_management_enabled:
        description: Schakelt de beveiligde functies voor herstel en volledige verwijdering in. Laat dit 
          tijdens normaal gebruik uitgeschakeld.
        name: Historiebeheer
      report_timezone:
        description: IANA-tijdzone voor daggrenzen en tijdstempels, bijvoorbeeld Europe/Amsterdam.
        name: Tijdzone rapporten
      retention_days:
        description: Aantal dagen dat metingen in SQLite worden bewaard.
        name: Bewaartermijn geschiedenis
    name: Geschiedenis en back-up
  interface:
    description: Gedeelde taal, weergavemodus en MQTT-presentatie.
    fields:
      custom_value_font_size_px:
        description: "Grootte in pixels (20–64), alleen gebruikt bij Aangepast."
        name: "Aangepaste tekengrootte"
      main_value_size:
        description: "Stelt de standaardgrootte in: klein, middel, groot of aangepast."
        name: "Tekengrootte hoofdmeetwaarde"
      publish_advanced_sensors:
        description: Publiceert statistieken, basislijn en alarmwaarden via MQTT Discovery.
        name: Geavanceerde MQTT-sensoren publiceren
      ui_language:
        description: Auto volgt de browsertaal.
        name: Interfacetaal
      ui_mode:
        description: Eenvoudig toont kernwaarden; Geavanceerd voegt analyse, onderhoud en exports toe.
        name: Rapportweergave
    name: Interface
  safety:
    description: Gedeeld absoluut drempelprofiel en aangepaste waarschuwingsniveaus.
    fields:
      danger_cpm:
        description: Begin van rood. Moet hoger zijn dan de waarschuwingsdrempel.
        name: Aangepast gevaar CPM
      danger_usvh:
        description: Begin van rood voor het afgeleide dosistempo.
        name: Aangepast gevaar µSv/h
      profile:
        description: GQ gebruikt fabrikantbanden. BfS- en ICRP-referenties rekenen 1 en 20 mSv/jaar wiskundig 
          om naar een continu dosistempo; dit zijn geen officiële directe alarmgrenzen. Aangepast gebruikt de 
          velden hieronder.
        name: Drempelprofiel
      threshold_basis:
        description: Gebruikt CPM, afgeleid dosistempo of het strengste resultaat. Alleen actief bij 
          Aangepast.
        name: Evaluatie aangepast profiel
      warning_cpm:
        description: Begin van geel. Alleen actief bij Aangepast.
        name: Aangepaste waarschuwing CPM
      warning_usvh:
        description: Begin van geel voor het afgeleide dosistempo.
        name: Aangepaste waarschuwing µSv/h
    name: Veiligheidsbeoordeling
  system:
    description: Gedeelde technische instellingen voor de volledige add-on.
    fields:
      log_level:
        description: Detailniveau van de add-onlogboeken.
        name: Logniveau
      serial_scheduler_enabled:
        description: Serialiseer opdrachtvensters voor tellers die de USB-controller van de host delen.
        name: Gedeelde seriële planner
      serial_scheduler_gap_seconds:
        description: Rusttijd in seconden tussen opdrachtvensters van verschillende tellers.
        name: Rustpauze van planner
    name: Systeem
