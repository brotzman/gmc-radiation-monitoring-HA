        name: Y-schaal voor oriëntatie
        description: Ruwe tellingen van de Y-as die overeenkomen met 1 g.
      orientation_scale_z:
        name: Z-schaal voor oriëntatie
        description: Ruwe tellingen van de Z-as die overeenkomen met 1 g.
      orientation_calibration_name:
        name: Naam van kalibratieprofiel
        description: Naam die bij de berekende oriëntatiewaarden wordt weergegeven.
      dead_time_us:
        description: Vooraf ingesteld door het detectorprofiel. Vul alleen een waarde in om de voorinstelling 
