        name: Fizyczny numer seryjny (opcjonalnie)
        description: Opcjonalna kontrola tożsamości. Po ustawieniu podłączony licznik musi zgłosić dokładnie 
          ten numer seryjny; w przeciwnym razie konfiguracja dwutubowa zostanie wyłączona ze względów 
          bezpieczeństwa.
      dual_tube_mode:
        name: Tryb tub (zaawansowany)
        description: «separate» ocenia oba kanały osobno; «curve» używa skonfigurowanego punktu przełączenia.
      dual_tube_switch_cpm:
        name: CPM przełączenia drugiej tuby
        description: Roboczy punkt przełączenia drugiej tuby. Zmieniać tylko na podstawie zweryfikowanych 
          danych urządzenia.
      high_dose_tube_model:
        name: 'Druga tuba: Model tuby'
        description: Model drugiej tuby wysokodawkowej.
      high_dose_cpm_per_usvh:
        name: 'Druga tuba: Współczynnik przeliczeniowy'
        description: Współczynnik przeliczeniowy CPM-dawka drugiej tuby. Bez zweryfikowanej kalibracji 
          pozostawić puste.
      high_dose_dead_time_us:
        name: 'Druga tuba: Czas martwy detektora'
        description: Czas martwy drugiej tuby w mikrosekundach.
      high_dose_reliable_max_cpm:
        name: 'Druga tuba: Maksymalne wiarygodne CPM'
        description: Najwyższa częstość zliczeń uznawana za wiarygodną dla drugiej tuby.
      high_dose_dead_time_model:
        name: 'Druga tuba: Model czasu martwego'
        description: Model czasu martwego drugiej tuby.
      high_dose_conversion_factor_uncertainty_percent:
        name: 'Druga tuba: Niepewność współczynnika przeliczeniowego'
        description: Względna niepewność standardowa współczynnika przeliczeniowego drugiej tuby w procentach.
      high_dose_calibration_uncertainty_percent:
        name: 'Druga tuba: Niepewność kalibracji'
        description: Względna niepewność standardowa kalibracji drugiej tuby w procentach.
      high_dose_calibration_reference:
        name: 'Druga tuba: Odniesienie kalibracji'
        description: Certyfikat, laboratorium lub inne odniesienie kalibracji drugiej tuby.
  gmcmap:
    description: Wspólne konto i ustawienia sieciowe dla publicznych wysyłek. Identyfikator licznika pozostaje
      przypisany do urządzenia.
    fields:
      account_id:
        description: Identyfikator zarejestrowanego konta GMCMap. Nie jest zapisywany w logach ani eksportach 
          diagnostycznych.
        name: Identyfikator użytkownika (AID)
      enabled:
        description: Opcjonalnie wysyła pomiary na publiczną mapę świata GMCMap. Domyślnie wyłączone.
        name: Włącz publiczne wysyłanie
      privacy_confirmed:
        description: Musi być włączone przed wysłaniem danych. Lokalizacja i dane stacji są zarządzane na 
          koncie GMCMap i mogą być publiczne.
        name: Potwierdź publiczne przesyłanie danych
      timeout:
        description: Maksymalny czas oczekiwania na żądanie GMCMap w sekundach. Błędy są ponawiane w tle z 
          rosnącym opóźnieniem.
        name: Limit czasu sieci
      upload_interval:
        description: Liczba sekund między publicznymi wysłaniami dla każdego urządzenia. Zalecane jest co 
          najmniej 120–300 sekund.
        name: Interwał wysyłania
    name: GMCMap (wspólne)
  history:
    description: Lokalne przechowywanie, strefa czasowa raportów i chronione zarządzanie historią.
    fields:
      history_management_enabled:
        description: Włącza chronione narzędzia przywracania i całkowitego usuwania historii. Podczas 
          normalnej pracy pozostaw wyłączone.
        name: Zarządzanie historią
      report_timezone:
        description: Strefa IANA dla granic dni i znaczników czasu, np. Europe/Warsaw.
        name: Strefa czasowa raportów
      retention_days:
        description: Liczba dni przechowywania pomiarów w SQLite.
        name: Okres przechowywania historii
    name: Historia i kopia zapasowa
  interface:
    description: Wspólny język, tryb widoku i prezentacja MQTT.
    fields:
      publish_advanced_sensors:
        description: Publikuje statystyki, poziom bazowy i alarmy przez MQTT Discovery.
        name: Publikuj zaawansowane sensory MQTT
      ui_language:
        description: Auto używa języka przeglądarki.
        name: Język interfejsu
      ui_mode:
        description: Prosty pokazuje najważniejsze wartości; Zaawansowany dodaje analizy, konserwację i 
          eksport.
        name: Widok raportów
    name: Interfejs
  safety:
    description: Wspólny profil progów bezwzględnych i własne poziomy ostrzegawcze.
    fields:
      danger_cpm:
        description: Początek czerwonego zakresu. Musi być wyższy od progu ostrzegawczego.
        name: Własne zagrożenie CPM
      danger_usvh:
        description: Początek czerwonego zakresu wyliczonej mocy dawki.
        name: Własne zagrożenie µSv/h
