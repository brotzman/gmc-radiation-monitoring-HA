All GMC history was deleted: Cała historia GMC została usunięta
Another report or maintenance job is running: Trwa wykonywanie innego zadania raportu lub konserwacji
Complete history deletion failed: Całkowite usunięcie historii nie powiodło się
Danger zone: Strefa niebezpieczeństwa
Delete all GMC history: Usuń całą historię GMC
Deletion confirmation text must be exactly DELETE ALL GMC HISTORY: Tekst potwierdzenia usunięcia musi mieć 
  dokładnie postać DELETE ALL GMC HISTORY
History deleted: Historia usunięta
Invalid deletion confirmation: Nieprawidłowe potwierdzenie usunięcia
? Permanently delete all GMC history from this app and Home Assistant Recorder. This includes CPM, 
  temperature, voltage, gyro and tube measurements for every known GMC and all time periods.
: Trwale usuń całą historię GMC z tej aplikacji i rejestratora Home Assistant. Obejmuje to pomiary CPM, 
  temperatury, napięcia, żyroskopu i rurki dla każdego znanego GMC i wszystkich okresów.
This cannot be undone. Delete all GMC history?: Tego nie można cofnąć. Usunąć całą historię GMC?
Type DELETE ALL GMC HISTORY to confirm: Wpisz DELETE ALL GMC HISTORY, aby potwierdzić
configuration:
  analysis:
    description: Wspólne ustawienia poziomu bazowego, sygnalizacji i zdarzeń dla wszystkich urządzeń.
    fields:
      baseline_learning_days:
        description: Liczba dni historii używana do lokalnego poziomu tła.
        name: Okres uczenia poziomu bazowego
      external_temperature_entity:
        description: Czujnik Home Assistant używany do korelacji CPM z temperaturą, gdy GMC nie ma 
          wewnętrznego czujnika temperatury. Identyfikator encji pozostaje edytowalny.
        name: Encja temperatury zewnętrznej
      external_temperature_max_age_seconds:
        description: Starsze stany temperatury Home Assistant nie są używane do korelacji.
        name: Maksymalny wiek temperatury zewnętrznej
      external_temperature_name:
        description: Zapasowa przyjazna nazwa używana do odnajdywania czujnika temperatury, gdy skonfigurowany
          identyfikator encji jest inny lub został zmieniony.
        name: Nazwa wyszukiwania temperatury zewnętrznej
      cosmic_hint_enabled:
        description: Uczy ostrożnej sygnatury tła związanej z ciśnieniem. To tylko wskazanie statystyczne i 
          nie wyłącza ostrzeżeń.
        name: Statystyczne wskazanie wpływu kosmicznego
      pressure_weather_entity_primary:
        description: Główna encja pogodowa Home Assistant dla bieżącego ciśnienia.
        name: Główna encja pogodowa ciśnienia
      pressure_weather_entity_secondary:
        description: Opcjonalna druga encja do kontroli wiarygodności ciśnienia.
        name: Dodatkowa encja pogodowa ciśnienia
      pressure_weather_source_name:
        description: Nazwa dostawcy wyświetlana przy źródle ciśnienia.
        name: Dostawca źródła ciśnienia
      pressure_weather_max_age_seconds:
        description: Starsze wartości ciśnienia są wykluczane z uczenia.
        name: Maksymalny wiek wartości ciśnienia
      pressure_weather_max_difference_hpa:
        description: Maksymalna dozwolona różnica między dwoma źródłami ciśnienia.
        name: Maksymalna różnica źródeł ciśnienia
      rapid_rise_percent:
        description: Procentowy wzrost wywołujący zdarzenie w wybranym oknie.
        name: Próg szybkiego wzrostu
      rapid_rise_window_minutes:
        description: Okres porównania w minutach.
        name: Okno szybkiego wzrostu
      smart_alerts_enabled:
        description: Wykrywa szybkie wzrosty, utrzymujące się podwyższenie i powrót do normy.
        name: Inteligentne zdarzenia
      sustained_alert_minutes:
        description: Minuty powyżej wyuczonego poziomu bazowego przed zdarzeniem trwałym.
        name: Utrzymujące się podwyższenie
      traffic_light_red_percent:
        description: Czerwony próg odchylenia; musi być wyższy od żółtego. Nie jest limitem bezpieczeństwa.
        name: 'Względny sygnalizator: czerwony'
      traffic_light_yellow_percent:
        description: Procentowe odchylenie średniej godzinowej od wyuczonego poziomu bazowego. Nie jest 
          limitem bezpieczeństwa.
        name: 'Względny sygnalizator: żółty'
    name: Analiza tła
  devices:
    description: Pełna konfiguracja dla GMC-300, GMC-320, GMC-600/600+ i innych liczników z jedną fizyczną 
      tubą. Ustawienia dwóch tub nie są tutaj wyświetlane.
    fields:
      auxiliary_read_interval:
        description: Liczba sekund między odczytami temperatury, napięcia, dwóch tub, czasu urządzenia i 
          żyroskopu. CPM nadal używa interwału pomiarowego; 0 odczytuje wartości pomocnicze w każdym cyklu.
        name: Interwał odczytu pomocniczego
      command_timeout:
        description: Maksymalne oczekiwanie w sekundach.
        name: Limit czasu odpowiedzi
      cpm_per_usvh:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Współczynnik przeliczeniowy'
      device_clock_warning_seconds:
        description: Dopuszczalna różnica w sekundach.
        name: Próg ostrzeżenia zegara
      gmcmap_counter_id:
        description: Oddzielny publiczny identyfikator GMCMap.
        name: Identyfikator licznika GMCMap
      heartbeat_enabled:
        description: Włącz bieżące CPS, jeśli obsługiwane.
        name: Włącz heartbeat 1 Hz
      inter_command_delay_ms:
        description: Przerwa w milisekundach.
        name: Odstęp między poleceniami
      name:
        description: Unikalna nazwa w Home Assistant i panelu.
        name: Nazwa wyświetlana
      read_device_time:
        description: Odczytaj zegar GMC, jeśli jest obsługiwany.
        name: Odczyt zegara urządzenia
      read_gyro:
        description: Pobieraj opcjonalne dane żyroskopu.
        name: Odczyt żyroskopu
      scan_interval:
        description: Sekundy między zapisanymi pomiarami.
        name: Interwał pomiaru
      serial_debug:
        description: Rejestruj ograniczone podglądy szesnastkowe i ASCII ramek TX/RX dla tego urządzenia. 
          Włączaj tylko podczas diagnostyki.
        name: Debugowanie ramek szeregowych
      serial_debug_max_bytes:
        description: Maksymalna liczba bajtów wyświetlanych dla każdej ramki TX/RX.
        name: Limit bajtów ramki debugowania
      serial_startup_delay:
        description: Opóźnienie uruchomienia w sekundach przed inicjalizacją urządzenia. Większe 
          skonfigurowane wartości są zachowywane, a kolejne urządzenia są zawsze rozdzielone co najmniej 15 
          sekundami.
        name: Opóźnienie uruchomienia portu szeregowego
      orientation_calibration_enabled:
        name: Kalibracja orientacji
        description: Użyj skonfigurowanych przesunięć i skal dla przechyłu, pochylenia i nachylenia.
      orientation_calibration_serial:
        name: Numer seryjny urządzenia kalibracyjnego
        description: Numer seryjny, do którego należy ta kalibracja.
      orientation_offset_x:
        name: Przesunięcie orientacji X
        description: Surowe przesunięcie zera osi X z kalibracji w sześciu pozycjach.
      orientation_offset_y:
        name: Przesunięcie orientacji Y
        description: Surowe przesunięcie zera osi Y z kalibracji w sześciu pozycjach.
      orientation_offset_z:
        name: Przesunięcie orientacji Z
        description: Surowe przesunięcie zera osi Z z kalibracji w sześciu pozycjach.
      orientation_scale_x:
        name: Skala orientacji X
        description: Surowa liczba jednostek osi X odpowiadająca 1 g.
      orientation_scale_y:
        name: Skala orientacji Y
        description: Surowa liczba jednostek osi Y odpowiadająca 1 g.
      orientation_scale_z:
        name: Skala orientacji Z
        description: Surowa liczba jednostek osi Z odpowiadająca 1 g.
      orientation_calibration_name:
        name: Nazwa profilu kalibracji
        description: Nazwa wyświetlana wraz z obliczonymi wartościami orientacji.
      dead_time_us:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Czas martwy detektora'
      reliable_max_cpm:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Maksymalne wiarygodne CPM'
      dead_time_model:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Model czasu martwego'
      conversion_factor_uncertainty_percent:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Niepewność współczynnika przeliczeniowego'
      calibration_uncertainty_percent:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Niepewność kalibracji'
      calibration_reference:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Odniesienie kalibracji'
      tube_model:
        description: Wstępnie ustawione przez profil detektora. Wprowadź wartość tylko w celu zastąpienia 
          ustawienia dla tego urządzenia.
        name: 'Jedyna/główna tuba: Model tuby'
      detector_profile:
        name: Profil urządzenia (automatyczny/wstępny)
        description: Wybiera profil aplikacyjny urządzenia. Tryb automatyczny rozpoznaje rodzinę GMC na 
          podstawie tożsamości urządzenia lub skonfigurowanej nazwy i wczytuje wartości robocze modelu tuby, 
          czasu martwego, współczynnika przeliczeniowego i progów. Nie weryfikuje fizycznie wymienionej tuby.
    name: Urządzenia z jedną tubą
  dual_tube_devices:
    name: Urządzenia z dwiema tubami
    description: Pełna konfiguracja dla GMC-500+ i innych obsługiwanych liczników z dwiema tubami. Ustawienia 
