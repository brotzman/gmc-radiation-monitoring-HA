configuration:
  analysis:
    description: Wspólne ustawienia poziomu bazowego, sygnalizacji i zdarzeń dla wszystkich
      urządzeń.
    fields:
      baseline_learning_days:
        description: Liczba dni historii używana do lokalnego poziomu tła.
        name: Okres uczenia poziomu bazowego
      external_temperature_entity:
        description: Home Assistant sensor used for CPM–temperature correlation when
          the GMC has no internal temperature sensor. The entity ID remains editable.
        name: External temperature entity
      external_temperature_max_age_seconds:
        description: Older Home Assistant temperature states are not used for correlation.
        name: Maximum external temperature age
      external_temperature_name:
        description: Friendly-name fallback used to locate the temperature sensor
          when the configured entity ID differs or was renamed.
        name: External temperature search name
      cosmic_hint_enabled:
        description: Uczy ostrożnej sygnatury tła związanej z ciśnieniem. To tylko
          wskazanie statystyczne i nie wyłącza ostrzeżeń.
        name: Statystyczne wskazanie wpływu kosmicznego
      pressure_weather_entity_primary:
        description: Główna encja pogodowa Home Assistant dla bieżącego ciśnienia.
        name: Główna encja pogodowa ciśnienia
      pressure_weather_entity_secondary:
        description: Opcjonalna druga encja do kontroli wiarygodności ciśnienia.
        name: Dodatkowa encja pogodowa ciśnienia
      pressure_weather_source_name:
        description: Nazwa dostawcy wyświetlana przy źródle ciśnienia.
        name: Dostawca źródła ciśnienia
      pressure_weather_max_age_seconds:
        description: Starsze wartości ciśnienia są wykluczane z uczenia.
        name: Maksymalny wiek wartości ciśnienia
      pressure_weather_max_difference_hpa:
        description: Maksymalna dozwolona różnica między dwoma źródłami ciśnienia.
        name: Maksymalna różnica źródeł ciśnienia
      rapid_rise_percent:
        description: Procentowy wzrost wywołujący zdarzenie w wybranym oknie.
        name: Próg szybkiego wzrostu
      rapid_rise_window_minutes:
        description: Okres porównania w minutach.
        name: Okno szybkiego wzrostu
      smart_alerts_enabled:
        description: Wykrywa szybkie wzrosty, utrzymujące się podwyższenie i powrót
          do normy.
        name: Inteligentne zdarzenia
      sustained_alert_minutes:
        description: Minuty powyżej wyuczonego poziomu bazowego przed zdarzeniem trwałym.
        name: Utrzymujące się podwyższenie
      traffic_light_red_percent:
        description: Czerwony próg odchylenia; musi być wyższy od żółtego. Nie jest
          limitem bezpieczeństwa.
        name: 'Względny sygnalizator: czerwony'
      traffic_light_yellow_percent:
        description: Procentowe odchylenie średniej godzinowej od wyuczonego poziomu
          bazowego. Nie jest limitem bezpieczeństwa.
        name: 'Względny sygnalizator: żółty'
    name: Analiza tła
  devices:
    description: Skonfiguruj każdy podłączony licznik GMC niezależnie. Dodaj jeden
      wpis dla każdego urządzenia fizycznego.
    fields:
      auxiliary_read_interval:
        description: Seconds between temperature, voltage, dual-tube, device-time
          and gyro reads. CPM still uses the measurement interval; 0 reads auxiliary
          values every cycle.
        name: Auxiliary read interval
      command_timeout:
        description: Maksymalne oczekiwanie w sekundach.
        name: Limit czasu odpowiedzi
      cpm_per_usvh:
        description: Współczynnik przeliczeniowy właściwy dla tuby.
        name: CPM na µSv/h
      device_clock_warning_seconds:
        description: Dopuszczalna różnica w sekundach.
        name: Próg ostrzeżenia zegara
      gmcmap_counter_id:
        description: Oddzielny publiczny identyfikator GMCMap.
        name: Identyfikator licznika GMCMap
      heartbeat_enabled:
        description: Włącz bieżące CPS, jeśli obsługiwane.
        name: Włącz heartbeat 1 Hz
      inter_command_delay_ms:
        description: Przerwa w milisekundach.
        name: Odstęp między poleceniami
      name:
        description: Unikalna nazwa w Home Assistant i panelu.
        name: Nazwa wyświetlana
      read_device_time:
        description: Odczytaj zegar GMC, jeśli jest obsługiwany.
        name: Odczyt zegara urządzenia
      read_gyro:
        description: Pobieraj opcjonalne dane żyroskopu.
        name: Odczyt żyroskopu
      scan_interval:
        description: Sekundy między zapisanymi pomiarami.
        name: Interwał pomiaru
      serial_debug:
        description: Log bounded TX/RX hexadecimal and ASCII previews for this device.
          Enable only while diagnosing.
        name: Serial frame debug
      serial_debug_max_bytes:
        description: Maximum number of bytes shown for each TX/RX frame.
        name: Debug frame byte limit
      serial_startup_delay:
        description: Opóźnienie uruchomienia w sekundach przed inicjalizacją urządzenia.
          Większe skonfigurowane wartości są zachowywane, a kolejne urządzenia są
          zawsze rozdzielone co najmniej 15 sekundami.
        name: Serial startup delay
      orientation_calibration_enabled:
        name: Orientation calibration
        description: Use the configured offsets and scales for roll, pitch and inclination.
      orientation_calibration_serial:
        name: Calibration device serial
        description: Serial number to which this calibration belongs.
      orientation_offset_x:
        name: Orientation X offset
        description: Raw X-axis zero offset from the six-position calibration.
      orientation_offset_y:
        name: Orientation Y offset
        description: Raw Y-axis zero offset from the six-position calibration.
      orientation_offset_z:
        name: Orientation Z offset
        description: Raw Z-axis zero offset from the six-position calibration.
      orientation_scale_x:
        name: Orientation X scale
        description: Raw X-axis counts corresponding to 1 g.
      orientation_scale_y:
        name: Orientation Y scale
        description: Raw Y-axis counts corresponding to 1 g.
      orientation_scale_z:
        name: Orientation Z scale
        description: Raw Z-axis counts corresponding to 1 g.
      orientation_calibration_name:
        name: Calibration profile name
        description: Name shown with the calculated orientation values.
    name: Urządzenia
  gmcmap:
    description: Wspólne konto i ustawienia sieciowe dla publicznych wysyłek. Identyfikator
      licznika pozostaje przypisany do urządzenia.
    fields:
      account_id:
        description: Identyfikator zarejestrowanego konta GMCMap. Nie jest zapisywany
          w logach ani eksportach diagnostycznych.
        name: Identyfikator użytkownika (AID)
      enabled:
        description: Opcjonalnie wysyła pomiary na publiczną mapę świata GMCMap. Domyślnie
          wyłączone.
        name: Włącz publiczne wysyłanie
      privacy_confirmed:
        description: Musi być włączone przed wysłaniem danych. Lokalizacja i dane
          stacji są zarządzane na koncie GMCMap i mogą być publiczne.
        name: Potwierdź publiczne przesyłanie danych
      timeout:
        description: Maksymalny czas oczekiwania na żądanie GMCMap w sekundach. Błędy
          są ponawiane w tle z rosnącym opóźnieniem.
        name: Limit czasu sieci
      upload_interval:
        description: Liczba sekund między publicznymi wysłaniami dla każdego urządzenia.
          Zalecane jest co najmniej 120–300 sekund.
        name: Interwał wysyłania
    name: GMCMap (wspólne)
  history:
    description: Wspólny czas przechowywania, strefa raportów i ustawienia przywracania.
    fields:
      enable_purge_all_history:
        description: Pokazuje kartę zagrożenia do usunięcia wszystkich danych GMC i włącza operację po stronie serwera. Ze względów bezpieczeństwa domyślnie wyłączone.
        name: Zezwól na pełne usuwanie
      enable_restore:
        description: Tymczasowo pozwala importować SQLite. Domyślnie wyłączone ze
          względów bezpieczeństwa.
        name: Zezwól na przywracanie
      report_timezone:
        description: Strefa IANA dla granic dni i znaczników czasu, np. Europe/Warsaw.
        name: Strefa czasowa raportów
      retention_days:
        description: Liczba dni przechowywania pomiarów w SQLite.
        name: Okres przechowywania historii
    name: Historia i kopia zapasowa
  interface:
    description: Wspólny język, tryb widoku i prezentacja MQTT.
    fields:
      publish_advanced_sensors:
        description: Publikuje statystyki, poziom bazowy i alarmy przez MQTT Discovery.
        name: Publikuj zaawansowane sensory MQTT
      ui_language:
        description: Auto używa języka przeglądarki.
        name: Język interfejsu
      ui_mode:
        description: Prosty pokazuje najważniejsze wartości; Zaawansowany dodaje analizy,
          konserwację i eksport.
        name: Widok raportów
    name: Interfejs
  safety:
    description: Wspólny profil progów bezwzględnych i własne poziomy ostrzegawcze.
    fields:
      danger_cpm:
        description: Początek czerwonego zakresu. Musi być wyższy od progu ostrzegawczego.
        name: Własne zagrożenie CPM
      danger_usvh:
        description: Początek czerwonego zakresu wyliczonej mocy dawki.
        name: Własne zagrożenie µSv/h
      profile:
        description: GQ używa zakresów producenta. Odniesienia BfS i ICRP matematycznie
          przeliczają 1 i 20 mSv/rok na ciągłą moc dawki; nie są to oficjalne natychmiastowe
          progi alarmowe. Profil własny używa pól poniżej.
        name: Profil progów
      threshold_basis:
        description: Używa CPM, wyliczonej mocy dawki lub surowszego wyniku. Działa
          tylko dla profilu własnego.
        name: Ocena profilu własnego
      warning_cpm:
        description: Początek żółtego zakresu. Działa tylko dla profilu własnego.
        name: Własne ostrzeżenie CPM
      warning_usvh:
        description: Początek żółtego zakresu wyliczonej mocy dawki.
        name: Własne ostrzeżenie µSv/h
    name: Ocena bezpieczeństwa
  system:
    description: Wspólne ustawienia techniczne całego dodatku.
    fields:
      log_level:
        description: Szczegółowość dzienników dodatku.
        name: Poziom logowania
      serial_scheduler_enabled:
        description: Serialize command windows across counters sharing the host USB
          controller.
        name: Shared serial scheduler
      serial_scheduler_gap_seconds:
        description: Quiet time in seconds between command windows of different counters.
        name: Scheduler quiet gap
    name: System
'{count} measurements and {events} events were removed.': '{count} measurements and
  {events} events were removed.'
